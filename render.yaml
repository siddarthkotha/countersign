# Render Blueprint — one always-on web service serving the API, the WebSocket call path,
# and the built React SPA out of the same process/port (Task D1; BRIEF Amendment 1 + §14b(5)).
#
# plan: free for the WHOLE hackathon (founder ruling 2026-09-02, countermanding an earlier
# same-day "starter from day one" ruling) -- judges confirmed in the event's support chat
# that a cold start is "totally ok," and to host on the free tier. Free web services suspend
# after 15 minutes of inactivity and take about a minute to wake back up on the next request
# (verified, docs/hosting-render-check-2026-09-02.md); that's the accepted trade-off here,
# not a risk being managed around. `plan: starter` ($7/mo, always-on, no spin-down) remains
# a documented, one-line optional upgrade in docs/DEPLOY.md ("Optional: always-on for
# $7/month") -- not the default, and not needed unless the founder later decides the cold
# start actually is a problem in practice.
#
# region: oregon is a FIRST GUESS (UNKNOWN which Render region sits closest to AssemblyAI's
# realtime WebSocket servers) -- measure connect->session.ready latency from the deployed
# box (README's latency table already has a place for it) and move regions if a closer one
# measures meaningfully better. See docs/DEPLOY.md.
services:
  - type: web
    name: countersign
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Set in the Render dashboard, never in this file or the repo (hygiene law: secrets
      # only in the host's secret store). `sync: false` means Render will prompt for it on
      # first deploy and never overwrite whatever's already there from this blueprint.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # same-origin is always allowed; list extra origins here. http.ts's applyCors now
      # recognizes this service's OWN origin automatically (from the request's Host /
      # X-Forwarded-Host + X-Forwarded-Proto, which Render sets) -- no need to guess or hand-
      # enter the deployed URL. This var is only for a custom domain or a second front end.
      # Note: the `countersign` name slug on Render belongs to an unrelated product, so our
      # real URL carries a suffix Render appended -- same-origin handles that with zero
      # config either way. See docs/DEPLOY.md §3.
      - key: COUNTERSIGN_ALLOWED_ORIGINS
        value: ""
      - key: COUNTERSIGN_SESSION_CAP_SECONDS
        value: "300"
      - key: COUNTERSIGN_MAX_CONCURRENT
        value: "2"
      - key: COUNTERSIGN_DAILY_CAP
        value: "40"
      - key: COUNTERSIGN_KILL_SWITCH
        value: "0"
