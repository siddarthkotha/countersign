<meta charset="UTF-8">
<title>Countersign · Flight deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#050506;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#050506;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:
      radial-gradient(ellipse at 50% -10%, #23262b 0%, #15171b 45%, #101215 100%);
    color:#c9cdd2;
    font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    overflow:hidden;
    border:2px solid #2a2d33;
  }
  .panel-rivets{
    position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle,#3a3e46 1.5px,transparent 1.6px);
    background-size:48px 48px;background-position:12px 12px;opacity:.25;
  }
  .DISP{display:flex;}

  /* Header */
  .hdr{
    height:74px;display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;background:#0d0f12;border-bottom:3px solid #3a3d44;
  }
  .hdr-product{
    font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:30px;
    letter-spacing:1px;color:#ffb02e;text-transform:uppercase;
  }
  .hdr-meta{font-size:20px;color:#8fa3a8;letter-spacing:.5px;}

  /* Split */
  .split{display:flex;height:calc(1080px - 74px - 64px);}
  .left-pane,.right-pane{width:960px;padding:16px 28px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
  .left-pane{border-right:3px solid #2c2f35;}

  /* Agent states — annunciator strip */
  .agent-states{display:flex;gap:8px;}
  .state-pill{
    flex:1;text-align:center;padding:10px 4px;font-size:20px;font-weight:600;
    background:#1b1d21;border:2px solid #33373d;color:#565b62;border-radius:3px;
    font-family:'Big Shoulders Display',sans-serif;letter-spacing:.5px;text-transform:uppercase;
  }
  .state-pill.active{
    background:#ffb02e;border-color:#ffd27a;color:#1a1200;font-weight:800;
    box-shadow:0 0 22px 4px rgba(255,176,46,.55), inset 0 0 0 2px #7a4c00;
  }

  /* Audio levels — twin gauges */
  .audio-levels{display:flex;gap:16px;}
  .level-meter{flex:1;background:#101214;border:2px solid #2c2f35;border-radius:4px;padding:10px 14px;}
  .level-label{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;color:#7fdfd0;text-transform:uppercase;letter-spacing:.5px;}
  .level-track{height:16px;background:#1a1d20;border-radius:2px;margin:8px 0;overflow:hidden;border:1px solid #33373d;}
  .level-fill{height:100%;background:linear-gradient(90deg,#3a5a55,#5fe0c8);}
  .level-countersign .level-fill{background:linear-gradient(90deg,#7a5b1a,#ffb02e);}
  .level-state{font-size:20px;color:#8fa3a8;}

  /* Transcript */
  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
  }
  .turn{padding:6px 12px;border-left:4px solid #33373d;background:#0e0f12;border-radius:2px;}
  .turn-caller{border-left-color:#8a6a2a;}
  .turn-agent{border-left-color:#5fe0c8;}
  .turn-speaker{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.5px;color:#9aa1a8;}
  .turn-caller .turn-speaker{color:#e0b060;}
  .turn-agent .turn-speaker{color:#5fe0c8;}
  .turn-text{font-size:21px;line-height:1.28;color:#dfe3e6;margin-top:2px;}
  .turn-text .amt{color:#ffb02e;font-weight:700;font-size:1.08em;}
  .turn-note{font-size:20px;color:#ff9c4a;font-style:italic;margin-top:2px;}

  /* Right pane */
  .state-machine{background:#101214;border:2px solid #2c2f35;border-radius:4px;padding:12px 16px;}
  .sm-states{display:flex;align-items:center;gap:6px;}
  .sm-node{
    flex:1;text-align:center;padding:9px 4px;font-size:20px;font-weight:700;
    background:#1b1d21;border:2px solid #33373d;color:#6a6f76;
    font-family:'Big Shoulders Display',sans-serif;letter-spacing:.5px;
  }
  .sm-node.current{background:#ffb02e;border-color:#ffd27a;color:#1a1200;box-shadow:0 0 18px 3px rgba(255,176,46,.5);}
  .sm-outcomes{display:flex;gap:10px;margin-top:6px;}
  .sm-outcome{flex:1;font-size:20px;padding:5px 10px;background:#17191c;border:2px solid #2c2f35;color:#8a9096;}
  .sm-outcome.active{border-color:#ff9c4a;color:#ffb02e;font-weight:700;background:#1e1608;}
  .sm-outcome-detail{font-size:20px;color:#7a8086;}
  .sm-outcome-detail::before{content:" — ";}

  /* Evidence cards -> annunciator tiles */
  .evidence-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .evidence-card{
    background:#1c1204;border:2px solid #6a4a12;border-radius:3px;padding:6px 10px;
    box-shadow:0 0 14px 1px rgba(255,176,46,.28), inset 0 0 0 1px #4a3208;
  }
  .ev-label{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;color:#d8b878;text-transform:uppercase;display:inline;}
  .ev-status{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:20px;color:#ffb02e;letter-spacing:.5px;display:inline;}
  .ev-status::before{content:" · ";color:#6a4a12;}
  .ev-detail{font-size:20px;color:#a89666;line-height:1.15;margin-top:1px;}

  /* Tool feed */
  .tool-feed{background:#101214;border:2px solid #2c2f35;border-radius:4px;padding:6px 14px;flex:none;}
  .tool-feed-title{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:20px;color:#7fdfd0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
  .tool-row{display:flex;gap:12px;font-size:20px;padding:2px 0;border-bottom:1px solid #22252a;line-height:1.15;white-space:nowrap;}
  .tool-time{color:#7fdfd0;width:60px;flex:none;}
  .tool-name{color:#dfe3e6;width:270px;flex:none;font-weight:600;}
  .tool-result{color:#8fa3a8;overflow:hidden;text-overflow:ellipsis;}

  /* Failure tally */
  .failure-tally{display:flex;align-items:baseline;gap:10px;background:#101214;border:2px solid #2c2f35;padding:5px 14px;border-radius:4px;}
  .failure-tally-count{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:32px;color:#ff9c4a;}
  .failure-tally-label{font-size:20px;color:#9aa1a8;text-transform:uppercase;letter-spacing:.5px;}

  /* Verdict banner -> big annunciator */
  .verdict-banner{
    background:#241503;border:3px solid #ffb02e;border-radius:4px;padding:10px 18px;
    box-shadow:0 0 30px 6px rgba(255,176,46,.45), inset 0 0 0 2px #7a4c00;
  }
  .verdict-headline-full{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:32px;color:#ffcf7a;letter-spacing:.5px;line-height:1.14;text-transform:uppercase;}
  .verdict-subline{font-size:20px;color:#d8b878;margin-top:4px;}

  /* Footer */
  .ftr{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#0d0f12;border-top:3px solid #3a3d44;}
  .footer-rule{font-size:20px;color:#c9cdd2;}
  .footer-hash{font-size:20px;color:#5fe0c8;}
</style>
<div id="surround">
  <div id="stage">
    <div class="panel-rivets"></div>
    <div class="hdr">
      <div class="hdr-product"></div>
      <div class="hdr-meta"></div>
    </div>
    <div class="split">
      <section class="left-pane">
        <div class="agent-states"></div>
        <div class="audio-levels">
          <div class="level-meter level-caller">
            <div class="level-label"></div>
            <div class="level-track"><div class="level-fill"></div></div>
            <div class="level-state"></div>
          </div>
          <div class="level-meter level-countersign">
            <div class="level-label"></div>
            <div class="level-track"><div class="level-fill"></div></div>
            <div class="level-state"></div>
          </div>
        </div>
        <div class="transcript"></div>
      </section>
      <section class="right-pane">
        <div class="state-machine">
          <div class="sm-states"></div>
          <div class="sm-outcomes"></div>
        </div>
        <div class="evidence-cards"></div>
        <div class="tool-feed">
          <div class="tool-feed-title">Tool calls</div>
          <div class="tool-feed-rows"></div>
        </div>
        <div class="failure-tally">
          <span class="failure-tally-count"></span>
          <span class="failure-tally-label"></span>
        </div>
        <div class="verdict-banner">
          <div class="verdict-headline-full"></div>
          <div class="verdict-subline"></div>
        </div>
      </section>
    </div>
    <div class="ftr">
      <div class="footer-rule"></div>
      <div class="footer-hash"></div>
    </div>
  </div>
</div>

<script>
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent =
    `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.querySelector('.transcript');
  DATA.transcript.forEach(turn => {
    const row = el('div', `turn turn-${turn.role}`);
    row.appendChild(el('div','turn-speaker', turn.speaker));
    row.appendChild(el('div','turn-text', emphasize(turn.text)));
    if(turn.note) row.appendChild(el('div','turn-note', turn.note));
    transcriptEl.appendChild(row);
  });

  const statesEl = document.querySelector('.agent-states');
  DATA.agentStates.forEach(s => {
    statesEl.appendChild(el('div', `state-pill${s.active ? ' active' : ''}`, s.name));
  });

  document.querySelector('.level-caller .level-label').textContent = DATA.audioLevels.caller.label;
  document.querySelector('.level-caller .level-fill').style.width = (DATA.audioLevels.caller.level*100)+'%';
  document.querySelector('.level-caller .level-state').textContent = DATA.audioLevels.caller.state;
  document.querySelector('.level-countersign .level-label').textContent = DATA.audioLevels.countersign.label;
  document.querySelector('.level-countersign .level-fill').style.width = (DATA.audioLevels.countersign.level*100)+'%';
  document.querySelector('.level-countersign .level-state').textContent = DATA.audioLevels.countersign.state;

  const smEl = document.querySelector('.sm-states');
  DATA.stateMachine.states.forEach(s => {
    smEl.appendChild(el('div', `sm-node${s===DATA.stateMachine.current?' current':''}`, s));
  });
  const smOutcomesEl = document.querySelector('.sm-outcomes');
  DATA.stateMachine.outcomes.forEach(o => {
    smOutcomesEl.appendChild(el('div', `sm-outcome${o.active?' active':''}`, `${o.name}<span class="sm-outcome-detail">${o.detail}</span>`));
  });

  const toolEl = document.querySelector('.tool-feed-rows');
  DATA.toolCalls.forEach(t => {
    const row = el('div','tool-row');
    row.appendChild(el('span','tool-time', t.time));
    row.appendChild(el('span','tool-name', t.name));
    row.appendChild(el('span','tool-result', t.result));
    toolEl.appendChild(row);
  });

  const evEl = document.querySelector('.evidence-cards');
  DATA.evidence.forEach(e => {
    const card = el('div', `evidence-card status-${slug(e.status)}`);
    card.setAttribute('data-status', e.status);
    const head = el('div','ev-head');
    head.appendChild(el('span','ev-label', e.label));
    head.appendChild(el('span','ev-status', e.status));
    card.appendChild(head);
    card.appendChild(el('div','ev-detail', e.detail));
    evEl.appendChild(card);
  });

  document.querySelector('.failure-tally-count').textContent = DATA.failureTally.count;
  document.querySelector('.failure-tally-label').textContent = DATA.failureTally.label;

  document.querySelector('.verdict-headline-full').textContent =
    DATA.verdictBanner.headline + ' — ' + DATA.verdictBanner.reasons.join(' · ');
  document.querySelector('.verdict-subline').textContent = DATA.verdictBanner.subline;

  document.querySelector('.footer-rule').textContent = DATA.footer.rule;
  document.querySelector('.footer-hash').textContent = 'Sealed record ' + DATA.footer.hash;

  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
