<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:#0a0d0b;color:#bcd8c8;font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;
    border:10px solid #1c211d;box-shadow:inset 0 0 60px rgba(0,0,0,.6);
  }
  .hdr{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:2px solid #294038;}
  .hdr-product{font-weight:700;font-size:26px;letter-spacing:3px;color:#39ff8a;text-transform:uppercase;text-shadow:0 0 8px rgba(57,255,138,.6);}
  .hdr-meta{font-size:20px;color:#6fa088;}

  .scene-controls{height:34px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 30px;border-bottom:1px solid #294038;background:#0d130f;}
  .ctrl-btn{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#39ff8a;background:transparent;border:1px solid #39ff8a;padding:3px 14px;cursor:pointer;text-shadow:0 0 4px rgba(57,255,138,.5);}
  .ctrl-btn:hover{background:rgba(57,255,138,.08);}
  .ctrl-btn:disabled{opacity:.4;cursor:default;}
  .sound-btn{color:#ffb020;border-color:#ffb020;text-shadow:0 0 4px rgba(255,176,32,.5);}
  .sound-btn[aria-pressed="false"]{color:#4a6858;border-color:#4a6858;text-shadow:none;}

  .split{display:flex;height:calc(1080px - 70px - 58px - 34px);}
  .left-pane,.right-pane{width:960px;padding:14px 26px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
  .left-pane{border-right:2px solid #294038;}

  /* ---------- live oscilloscope trace box ---------- */
  .trace-box{border:1px solid #294038;background:repeating-linear-gradient(0deg, transparent 0 39px, #1a2620 39px 40px),repeating-linear-gradient(90deg, transparent 0 39px, #1a2620 39px 40px),#0d130f;height:220px;position:relative;flex:none;overflow:hidden;}
  #ch1Canvas,#ch2Canvas{position:absolute;left:0;width:100%;height:110px;display:block;}
  #ch1Canvas{top:0;}
  #ch2Canvas{top:110px;}
  .trace-label{position:absolute;top:4px;left:8px;font-size:18px;color:#ffb020;text-shadow:0 0 4px rgba(255,176,32,.6);pointer-events:none;z-index:2;}
  .trace-label.ch2{top:114px;color:#39ff8a;text-shadow:0 0 4px rgba(57,255,138,.6);}
  .trace-marker-line{position:absolute;top:0;bottom:0;border-left:1px dashed #ffb020;opacity:.65;display:none;z-index:3;pointer-events:none;}
  .trace-marker-label{position:absolute;top:4px;font-size:16px;color:#ffb020;white-space:nowrap;display:none;z-index:3;transform:translateX(6px);text-shadow:0 0 4px rgba(255,176,32,.6);pointer-events:none;}

  /* ---------- profile block ---------- */
  .profile-block{display:flex;align-items:stretch;gap:14px;border:1px solid #294038;background:#0d130f;padding:10px 18px;height:388px;flex:none;}
  .pf-caller,.pf-countersign{width:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .pf-svg{width:209px;height:340px;}
  .pf-caption{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#6fa088;text-align:center;}
  .pf-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .pf-state-word{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:24px;color:#39ff8a;letter-spacing:1px;text-align:center;text-shadow:0 0 8px rgba(57,255,138,.6);}
  .pf-pause{font-size:15px;color:#ffb020;opacity:0;transition:opacity .2s;text-shadow:0 0 4px rgba(255,176,32,.5);}
  .pf-pause.show{opacity:1;}
  .pf-cs-outline{fill:none;stroke:#39ff8a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(57,255,138,.7));}
  .pf-cs-line{fill:none;stroke:#39ff8a;stroke-width:1.4;stroke-linecap:round;opacity:.6;filter:drop-shadow(0 0 2px rgba(57,255,138,.5));}
  .pf-cs-lips{fill:none;stroke:#39ff8a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(57,255,138,.7));}
  .pf-cl-outline{fill:none;stroke:#ffb020;stroke-width:2.1;stroke-linecap:round;}

  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);

  .turn{padding:4px 10px;border-left:3px solid #294038;}
  .turn-caller{border-left-color:#ffb020;}
  .turn-agent{border-left-color:#39ff8a;}

  .sm-states{display:flex;gap:6px;}
  .sm-node{flex:1;text-align:center;padding:7px 4px;font-size:20px;border:1px solid #294038;color:#4a6858;}

  .sm-outcomes{display:flex;gap:10px;margin-top:6px;}

  .sm-outcome.active{border-color:#39ff8a;color:#39ff8a;font-weight:700;}
  .sm-outcome-detail::before{content:" — ";}

  .evidence-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .evidence-card{border:1px solid #294038;padding:6px 10px;background:#0d130f;}
  .ev-head{display:flex;align-items:center;gap:8px;}
  .ev-label{font-size:20px;color:#8fbfa8;text-transform:uppercase;}
  .ev-status{font-size:20px;color:#39ff8a;font-weight:700;text-shadow:0 0 4px rgba(57,255,138,.5);}
  .ev-status::before{content:"= ";color:#4a6858;}
  .ev-detail{font-size:20px;color:#5e8873;line-height:1.15;margin-top:1px;}

  .tool-feed{border:1px solid #294038;padding:6px 14px;background:#0d130f;}
  .tool-feed-title{font-size:20px;color:#8fbfa8;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
  .tool-row{display:flex;gap:12px;font-size:20px;padding:2px 0;border-bottom:1px solid #17201a;white-space:nowrap;}
  .tool-time{color:#39ff8a;width:60px;flex:none;}
  .tool-name{color:#cfe8da;width:270px;flex:none;font-weight:600;}
  .tool-result{color:#5e8873;overflow:hidden;text-overflow:ellipsis;}

  .failure-tally{display:flex;align-items:baseline;gap:10px;border:1px solid #294038;padding:5px 14px;background:#0d130f;}
  .failure-tally-count{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:32px;color:#ffb020;text-shadow:0 0 6px rgba(255,176,32,.5);}
  .failure-tally-label{font-size:20px;color:#6fa088;text-transform:uppercase;letter-spacing:1px;}

  .verdict-banner{border:2px solid #39ff8a;padding:10px 18px;background:#0a1a10;opacity:0;box-shadow:none;}
  .verdict-banner.landed{opacity:1;box-shadow:0 0 30px 2px rgba(57,255,138,.35), inset 0 0 20px rgba(57,255,138,.08);transition:opacity .4s ease-out, box-shadow .5s ease-out;}
  .verdict-headline-full{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:32px;color:#39ff8a;letter-spacing:1px;line-height:1.15;text-transform:uppercase;text-shadow:0 0 10px rgba(57,255,138,.7);}
  .verdict-subline{font-size:20px;color:#8fbfa8;margin-top:4px;}

  .ftr{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-top:2px solid #294038;}
  .footer-rule{font-size:20px;color:#bcd8c8;}
  .footer-hash{font-size:20px;color:#39ff8a;transition:text-shadow .3s;}
  .footer-hash.sealed{text-shadow:0 0 8px rgba(57,255,138,.7);}

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TRACE_WINDOW = 4.0; // seconds visible across the trace width

  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent = `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.getElementById('transcript');
  const evidenceEl = document.getElementById('evidenceCards');
  const toolRowsEl = document.getElementById('toolRows');
  const tallyCountEl = document.getElementById('tallyCount');
  const tallyLabelEl = document.getElementById('tallyLabel');
  const verdictBannerEl = document.getElementById('verdictBanner');
  const verdictHeadlineEl = document.getElementById('verdictHeadline');
  const verdictSublineEl = document.getElementById('verdictSubline');
  const footerRuleEl = document.getElementById('footerRule');
  const footerHashEl = document.getElementById('footerHash');
  const stateWordEl = document.getElementById('stateWord');
  const pauseEl = document.getElementById('pauseMarker');
  const playBtn = document.getElementById('playBtn');
  const soundBtn = document.getElementById('soundBtn');
  const csSvgEl = document.getElementById('csSvg');
  const clSvgEl = document.getElementById('clSvg');
  const smStatesEl = document.getElementById('smStates');
  const smOutcomesEl = document.getElementById('smOutcomes');
  const ch1Canvas = document.getElementById('ch1Canvas');
  const ch2Canvas = document.getElementById('ch2Canvas');
  const markerLine = document.getElementById('markerLine');
  const markerLabel = document.getElementById('markerLabel');

  footerRuleEl.textContent = DATA.footer.rule;

  DATA.stateMachine.states.forEach(s => { const n = el('div','sm-node', s); n.dataset.name = s; smStatesEl.appendChild(n); });
  DATA.stateMachine.outcomes.forEach(o => { const n = el('div','sm-outcome', `${o.name}<span class="sm-outcome-detail">${o.detail}</span>`); n.dataset.name = o.name; smOutcomesEl.appendChild(n); });
  function setSmState(name){ Array.from(smStatesEl.children).forEach(n => n.classList.toggle('current', n.dataset.name===name)); }
  function setOutcomeFrozen(){ Array.from(smOutcomesEl.children).forEach(n => { if(n.dataset.name==='FROZEN') n.classList.add('active'); }); }
  function resetSmState(){ setSmState('CHECKS'); Array.from(smOutcomesEl.children).forEach(n => n.classList.remove('active')); }

  /* ---------- seeded RNG + syllable/envelope engine (drives BOTH the profile and the trace) ---------- */
  function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function countSyllables(word){ const w=word.toLowerCase().replace(/[^a-z]/g,''); if(!w) return 1; let syl=(w.match(/[aeiouy]+/g)||[]).length; if(w.length>2 && w.endsWith('e') && !w.endsWith('le')) syl-=1; return Math.max(1,syl); }
  function buildSchedule(text, duration, seed){
    const words = text.split(/\s+/).filter(Boolean);
    const rnd = mulberry32(seed);
    const sylCounts = words.map(countSyllables);
    const totalSyl = sylCounts.reduce((a,b)=>a+b,0) || 1;
    let t=0; const wordEvents=[]; const sylEvents=[];
    words.forEach((w,i)=>{
      const wStart=t; const wTime=(sylCounts[i]/totalSyl)*duration; const sDur=wTime/sylCounts[i];
      for(let s=0;s<sylCounts[i];s++){ const amp=Math.min(1,(0.55+rnd()*0.45)*(s===0?1.15:1.0)); sylEvents.push({start:t,end:t+sDur,amp}); t+=sDur; }
      wordEvents.push({word:w, start:wStart, end:t});
    });
    return { wordEvents, sylEvents, totalDuration:t };
  }
  function envelopeAt(sylEvents, localT, totalDur){
    if(localT<0 || localT>=totalDur) return 0;
    for(const e of sylEvents){ if(localT>=e.start && localT<e.end){ const p=(localT-e.start)/(e.end-e.start); return e.amp*Math.sin(Math.max(0,Math.min(1,p))*Math.PI); } }
    return 0;
  }
  function wordsVisibleAt(wordEvents, localT){ const out=[]; for(const we of wordEvents){ if(we.start<=localT) out.push(we.word); else break; } return out; }

  /* ---------- speaking windows (fixed script, independent of audio) ---------- */
  const CS_WINDOWS=[
    { start:0.0, end:4.2, schedule: buildSchedule(DATA.transcript[5].text, 6.0, 205) },
    { start:7.2, end:9.6, schedule: buildSchedule(DATA.transcript[7].text, 2.4, 207) },
    { start:11.5, end:19.0, schedule: buildSchedule(DATA.transcript[8].text, 7.3, 208) }
  ];
  const CALLER_WINDOW = { start:4.2, end:6.4, schedule: buildSchedule(DATA.transcript[6].text, 2.2, 206) };
  function isFrozen(t){ return t>=4.2 && t<7.2; }
  function csWindowAt(t){ for(const w of CS_WINDOWS){ if(t>=w.start && t<w.end) return w; } return null; }
  function envAtCsWindow(t){ const w=csWindowAt(t); if(!w) return 0; return envelopeAt(w.schedule.sylEvents, t-w.start, w.schedule.totalDuration); }
  function envAtCallerWindow(t){ if(t>=CALLER_WINDOW.start && t<CALLER_WINDOW.end){ return envelopeAt(CALLER_WINDOW.schedule.sylEvents, t-CALLER_WINDOW.start, CALLER_WINDOW.schedule.totalDuration); } return 0; }

  /* ---------- profile geometry: TRACED from a real human silhouette (v4) ----------
     Source: Wikimedia Commons, "William James Hubard - Profile of a Man - Google Art
     Project.jpg" (Public domain; File:William_James_Hubard_-_Profile_of_a_Man_-
     _Google_Art_Project.jpg). Cropped to the oval silhouette inset, Otsu-thresholded,
     morphological opening (box R3, drops a thin dangling appendage in the source
     photo without touching the real facial concavities), largest connected region
     that does not touch the crop border, Moore-neighbour boundary walk, Douglas-
     Peucker simplified (tolerance 1.5px @ 1200px working height), normalized to a
     400px-tall box, mirrored to face left. 121-point closed loop.
     Landmarks found by geometry, not eyeballed: nose tip = leftmost point in the
     middle third of the front (face) arc; philtrum = the first concavity (local max
     in x) after the nose; chin crease = the last concavity before the point where x
     begins a SUSTAINED climb (the jaw sweeping back toward the ear) — everything
     between is the mouth/chin cluster. See profile-trace.svg and source-and-trace.png
     in this folder for the raw trace and the source-vs-trace side by side. */
  const STATIC_PTS=[[122.4,0],[97.5,0],[94.4,1],[79.4,0],[69,6.2],[62.3,8.3],[54,17.1],[50.3,23.9],[47.7,24.4],[42.5,30.6],[34.8,46.2],[23.9,58.6],[23.9,62.3],[27,62.3],[30.6,58.6],[31.1,59.7],[27,72.1],[25.4,88.2],[20.8,105.8],[20.8,113.6],[22.8,118.8],[22.8,124],[13.5,139],[9.3,151],[1,165],[0,168.6],[1.6,175.4],[5.7,178],[13.5,178.5],[17.1,182.6],[17.6,188.8],[20.8,189.4]];
  const LIPS_PTS=[[20.8,189.4],[16.6,190.4],[15,193],[15,196.6],[20.2,200.3],[18.7,202.3],[18.7,208],[25.4,214.8],[25.4,217.9]];

  const FULL_LOOP = STATIC_PTS.concat(LIPS_PTS.slice(1), JAW_PTS.slice(1), BACK_PTS.slice().reverse().slice(1,-1));
  const VIEW_W = 246;
  const EAR_PIVOT=[187.8,180.0];
  const NOSTRIL_ANCHOR=[9.3,151.0];

  const MAX_JAW_ANGLE = 2.6; // degrees, at full envelope

  function mirrorX(pts, width){ return pts.map(([x,y])=>[width-x,y]); }
  function smoothPath(pts, closed){
    if(pts.length<3) return 'M'+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' L');
    const p = closed ? [pts[pts.length-1]].concat(pts,[pts[0],pts[1]]) : [pts[0]].concat(pts,[pts[pts.length-1]]);
    let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
    for(let i=1;i<p.length-2;i++){
      const p0=p[i-1],p1=p[i],p2=p[i+1],p3=p[i+2];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d += ` C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;

    if(closed) d += ' Z';
    return d;
  }
  function rotatePoint(p, pivot, angleDeg){
    const rad = angleDeg*Math.PI/180, dx=p[0]-pivot[0], dy=p[1]-pivot[1];
    const cos=Math.cos(rad), sin=Math.sin(rad);
    return [ pivot[0]+dx*cos-dy*sin, pivot[1]+dx*sin+dy*cos ];
  }
  // LIPS: displace each point outward/downward with the envelope; philtrum (index 0)
  // is the fixed anchor shared with STATIC, chin crease (last index) moves the most.
  function lipsPointsAt(env){
    const n = LIPS_PTS.length;
    return LIPS_PTS.map((p,i)=>{
      const w = i/(n-1);
      const amp = 4 + 5*w; // 4px..9px at 400px scale
      const dy = env*amp*w, dx = env*amp*w*0.25;
      return [ p[0]+dx, p[1]+dy ];
    });
  }
  // JAW: rotate about the ear region, tapered from full angle at the chin-crease end
  // (index 0) to zero at the neck end (last index, pinned to the static BACK chain);
  // index 0 is then snapped exactly onto the lips' current crease position so the
  // outline never breaks at either seam.
  function jawPointsAt(env, creaseAnchor){
    const n = JAW_PTS.length;
    const theta = -env*MAX_JAW_ANGLE;
    const pts = JAW_PTS.map((p,i)=>{
      const w = 1 - i/(n-1);
      return rotatePoint(p, EAR_PIVOT, theta*w);

    pts[0] = creaseAnchor.slice();
    return pts;
  }
  function jawShadowFrom(jawPts){ return jawPts.filter((_,i)=>i%3===0).map(([x,y])=>[x+7,y]); }

  const svgNS='http://www.w3.org/2000/svg';
  function makePath(id, cls, d, extra){ const p=document.createElementNS(svgNS,'path'); if(id) p.setAttribute('id',id); p.setAttribute('class',cls); p.setAttribute('d',d); if(extra) Object.entries(extra).forEach(([k,v])=>p.setAttribute(k,v)); return p; }

  function buildCsSvg(){
    const g=document.createElementNS(svgNS,'g'); g.setAttribute('id','csGroup');

    g.appendChild(makePath('csBack','pf-cs-outline', smoothPath(BACK_PTS,false)));
    g.appendChild(makePath('csLips','pf-cs-lips', smoothPath(LIPS_PTS,false)));
    g.appendChild(makePath('csJaw','pf-cs-outline', smoothPath(JAW_PTS,false)));
    // interior lines: ear / eyelid / nostril / jaw-shadow, hand-placed relative to
    // the traced landmark coordinates above, each drifting 1-2px while speaking.
    g.appendChild(makePath('csEar','pf-cs-line', smoothPath([[EAR_PIVOT[0]+6,EAR_PIVOT[1]-10],[EAR_PIVOT[0]-2,EAR_PIVOT[1]],[EAR_PIVOT[0]+5,EAR_PIVOT[1]+12]],false)));
    g.appendChild(makePath('csBrow','pf-cs-line', smoothPath([[BROW_ANCHOR[0]-4,BROW_ANCHOR[1]-3],[BROW_ANCHOR[0]+6,BROW_ANCHOR[1]-6]],false)));

    return {
      group:g, lips:document.getElementById('csLips'), jaw:document.getElementById('csJaw'),
      jawShadow:document.getElementById('csJawShadow'), ear:document.getElementById('csEar'),
      brow:document.getElementById('csBrow'), nostril:document.getElementById('csNostril')
    };
  }
  function buildClSvg(){
    const g=document.createElementNS(svgNS,'g'); g.setAttribute('id','clGroup');
    const per = Math.ceil(FULL_LOOP.length / 5);
    const groups = [];
    for(let k=0;k<5;k++) groups.push(FULL_LOOP.slice(k*per, Math.min(FULL_LOOP.length, (k+1)*per+1)));
    const keep = [0,2,4]; // omit the mouth/chin group and the neck/collar-back group -> reads as "incomplete"
    keep.forEach((gi)=>{

  const csRefs = buildCsSvg();
  const clRefs = buildClSvg();

  function pulseCaller(env){
    clRefs.group.style.filter = `drop-shadow(0 0 ${(3+env*9).toFixed(1)}px rgba(255,176,32,${(0.35+env*0.45).toFixed(2)}))`;
    clRefs.group.style.transform = `scale(${(1+env*0.03).toFixed(3)})`;
  }
  function restCaller(){ clRefs.group.style.filter = 'drop-shadow(0 0 2px rgba(255,176,32,.25))'; clRefs.group.style.transform='scale(1)'; }
  function resetFaces(){
    csRefs.lips.setAttribute('d', smoothPath(LIPS_PTS,false));
    csRefs.jaw.setAttribute('d', smoothPath(JAW_PTS,false));
    csRefs.jawShadow.setAttribute('d', smoothPath(jawShadowFrom(JAW_PTS),false));
    csRefs.ear.style.transform='translate(0,0)';
    csRefs.brow.style.transform='translate(0,0)';
    csRefs.nostril.style.transform='translate(0,0)';
    csRefs.group.style.transform='';

  }
  function applyDrift(t, speaking){
    const base = speaking ? 1.6 : 0;
    const amp = REDUCED_MOTION ? base*0.3 : base;
    if(amp===0){ csRefs.ear.style.transform='translate(0,0)'; csRefs.brow.style.transform='translate(0,0)'; csRefs.nostril.style.transform='translate(0,0)'; return; }
    csRefs.ear.style.transform = `translate(${(Math.sin(t*2.1+0.4)*amp).toFixed(2)}px, ${(Math.cos(t*1.6+0.4)*amp*0.6).toFixed(2)}px)`;
    csRefs.brow.style.transform = `translate(${(Math.sin(t*2.4+0.9)*amp*0.7).toFixed(2)}px, ${(Math.cos(t*1.9+0.9)*amp*0.5).toFixed(2)}px)`;
    csRefs.nostril.style.transform = `translate(${(Math.sin(t*1.8+1.6)*amp*0.6).toFixed(2)}px, ${(Math.cos(t*2.3+1.6)*amp*0.4).toFixed(2)}px)`;
  }
  function updateFaces(t){
    if(!isFrozen(t)){
      const w = csWindowAt(t);
      if(w){
        const env = envAtCsWindow(t);

        csRefs.lips.setAttribute('d', smoothPath(lipsNow,false));

        csRefs.lips.setAttribute('d', smoothPath(LIPS_PTS,false));
        csRefs.jaw.setAttribute('d', smoothPath(JAW_PTS,false));
        csRefs.jawShadow.setAttribute('d', smoothPath(jawShadowFrom(JAW_PTS),false));

  }

  /* ---------- live oscilloscope trace: SAME envelope generator as the profile, + noise ---------- */
  function smoothNoise(t){ return ((Math.sin(t*1.0)+Math.sin(t*2.7+1.1)+Math.sin(t*5.3+2.2))/3)*0.55; }
  function ch1ValueAt(t){
    let v = envAtCallerWindow(t) * Math.sin(t*42) * 0.85;
    if(t>=4.2 && t<4.55){ const dt=t-4.2; v += Math.exp(-dt*22) * Math.sin(dt*260) * 1.1; }
    v += smoothNoise(t*3.7) * 0.05;
    return v;
  }
  function ch2ValueAt(t){

  function sizeCanvas(canvas){
    const rect = canvas.getBoundingClientRect();
    if(rect.width<=0 || rect.height<=0) return;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.round(rect.width*dpr);
    canvas.height = Math.round(rect.height*dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const ctx = canvas.__ctx, W = canvas.__w, H = canvas.__h;
    if(!ctx || !W || !H) return;
    ctx.clearRect(0,0,W,H);
    const mid = H/2;
    const step = Math.max(1, W/220);
    const pts = [];
    for(let x=0; x<=W; x+=step){
      const frac = x/W;
      const sampleT = refT - TRACE_WINDOW*(1-frac);

    const xPct = Math.max(0,Math.min(1,frac))*100;
    markerLine.style.display='block'; markerLabel.style.display='block';
    markerLine.style.left = xPct+'%';
    markerLabel.style.left = xPct+'%';
  }
  function zeroValueAt(){ return 0; } // CH2 drops to a true flat line the instant it freezes

    drawChannel(ch2Canvas, frozen ? zeroValueAt : ch2ValueAt, '#39ff8a', frozen ? 0 : t, 34);

  /* ---------- transcript / evidence / tool feed / verdict rendering ---------- */
  const turnRowRefs = {};
  function createTurnRow(turnIndex, role){

  /* ---------- fixed 20s script timeline (unchanged from v2/v3) ---------- */
  const EVENTS = [

    { t:4.2, fn:()=>{ appendNote(5, 'interrupted at 03:12'); startTurnReveal(6, 4.2, CALLER_WINDOW.schedule, 'caller'); setState('LISTENING'); } },
    { t:6.4, fn:()=>{ showPause(true); } },

    { t:9.6, fn:()=>{ setState('VERIFYING'); setTally(3); } },

  /* ---------- speech synthesis (decorative only; timeline never depends on it) ---------- */
  let soundOn = true;
  let voicesCache = [];
  function refreshVoices(){
    if(!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices() || [];
    const enUS = voices.filter(v => /en-US/i.test(v.lang));
    const distinct = [];
    for(const v of enUS){ if(!distinct.some(d=>d.name===v.name)) distinct.push(v); if(distinct.length>=2) break; }
    voicesCache = distinct;
  }
  if(window.speechSynthesis){ refreshVoices(); window.speechSynthesis.onvoiceschanged = refreshVoices; }
  function speakLine(text, voiceIdx){
    if(!soundOn || !window.speechSynthesis) return;
    refreshVoices();
    if(voicesCache.length===0) return; // silent, no voices found
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voicesCache[voiceIdx % voicesCache.length];
    u.rate = 1.0;

  function clearScheduled(){ scheduledTimeouts.forEach(id=>clearTimeout(id)); scheduledTimeouts=[]; }
  function scheduleSpeech(){
    scheduledTimeouts.push(setTimeout(()=>speakLine(DATA.transcript[5].text,0), 0));
    scheduledTimeouts.push(setTimeout(()=>{ if(window.speechSynthesis) window.speechSynthesis.cancel(); speakLine(DATA.transcript[6].text,1); }, 4200));
    scheduledTimeouts.push(setTimeout(()=>speakLine(DATA.transcript[7].text,0), 7200));
    scheduledTimeouts.push(setTimeout(()=>speakLine(DATA.transcript[8].text,0), 11500));
  }

  /* ---------- run loop / controls ---------- */
  let playStartTime=null, rafId=null, running=false;
  function resetScene(){
    running=false;
    if(rafId) cancelAnimationFrame(rafId);
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    clearScheduled();
    appliedCount=0; activeReveal=null;
    for(const k in turnRowRefs) delete turnRowRefs[k];
    transcriptEl.innerHTML='';
    for(let i=0;i<5;i++){ // turns 01-05 (indices 0-4) shown pre-play; turn 06 (index 5) opens the scene at t=0
      const turn = DATA.transcript[i];
      const ref = createTurnRow(i, turn.role);
      ref.textSpan.innerHTML = emphasize(turn.text);
      if(turn.note) ref.row.appendChild(el('div','turn-note', turn.note));
    }
    setState('VERIFYING');
    showPause(false);
    evidenceEl.innerHTML='';
    addEvidenceCard(DATA.evidence[0]); addEvidenceCard(DATA.evidence[1]); addEvidenceCard(DATA.evidence[2]);
    toolRowsEl.innerHTML='';
    addToolRow(DATA.toolCalls[0]); addToolRow(DATA.toolCalls[1]);
    setTally(2);
    resetSmState();
    verdictBannerEl.classList.remove('landed');
    verdictHeadlineEl.textContent=''; verdictSublineEl.textContent='';
    footerHashEl.textContent = 'Sealed record —';
    footerHashEl.classList.remove('sealed');
    resetFaces();
    updateTrace(-4);
    playBtn.textContent = '▶ RUN SCENE';
    playBtn.dataset.state = 'play';
    playBtn.disabled = false;
  }
  function frame(now){
    if(!running) return;
    const t = (now-playStartTime)/1000;
    const tc = Math.min(t, END_AT);
    applyEvents(tc);
    updateActiveReveal(t);
    updateFaces(t);
    updateTrace(t);

    rafId = requestAnimationFrame(frame);
  }
  function endScene(){
    running=false;
    playBtn.disabled=false;
    playBtn.textContent = '↻ REPLAY';

  }
  function startScene(){
    resetScene();
    running=true;
    playBtn.disabled=true;
    playBtn.textContent = '▶ RUNNING…';

    playStartTime = performance.now();
    if(soundSnapshot) scheduleSpeech();

  }

  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));

  function fitStage(){
    const stage = document.getElementById('stage');

  }
  function onResize(){

  resetScene();

  setTimeout(()=>{ sizeCanvas(ch1Canvas); sizeCanvas(ch2Canvas); if(!running) updateTrace(-4); }, 60);
})();
