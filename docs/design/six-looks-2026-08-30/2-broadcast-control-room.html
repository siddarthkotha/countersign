<meta charset="UTF-8">
<title>Countersign · Broadcast control room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:#0b0d10;color:#dfe4e8;font-family:'IBM Plex Mono',ui-monospace,monospace;overflow:hidden;
    border:2px solid #1c2126;
  }
  .hdr{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0e1116;border-bottom:2px solid #1c2126;}
  .hdr-product{font-family:'Oswald',sans-serif;font-weight:700;font-size:28px;letter-spacing:2px;color:#eef2f5;text-transform:uppercase;}
  .hdr-product::before{content:"● ";color:#ff3b30;}
  .hdr-meta{font-size:20px;color:#7fa0b8;}

  .split{display:flex;height:calc(1080px - 70px - 60px);}
  .left-pane,.right-pane{width:960px;padding:16px 26px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
  .left-pane{border-right:2px solid #1c2126;background:linear-gradient(180deg,#0d1420,#0b0d10 22%);}

  /* Level meters — dominate top-left */
  .audio-levels{display:flex;gap:14px;}
  .level-meter{flex:1;background:#0e141c;border:1px solid #24303c;border-radius:3px;padding:10px 14px;}
  .level-label{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;color:#bcd4e6;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;}
  .level-label .level-peak{font-size:20px;color:#5a7488;font-weight:400;letter-spacing:0;}
  .level-ladder{display:flex;gap:3px;height:26px;margin:8px 0 4px;}
  .seg{flex:1;background:#1a2028;border-radius:1px;}
  .seg.lit{background:#ffd166;box-shadow:0 0 6px 1px rgba(255,209,102,.6);}
  .level-state{font-size:20px;color:#7fa0b8;}

  /* Agent states as monitor labels */
  .agent-states{display:flex;gap:6px;}
  .state-pill{
    flex:1;text-align:center;padding:8px 4px;font-size:20px;font-weight:500;
    background:#0e141c;border:1px solid #24303c;color:#5a7488;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;
  }
  .state-pill.active{background:#ffd166;color:#1a1200;font-weight:700;border-color:#ffd166;}

  /* Transcript — caption feed */
  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
  }
  .turn{padding:5px 12px;background:#0e141c;border-left:4px solid #24303c;}
  .turn-caller{border-left-color:#ffd166;}
  .turn-agent{border-left-color:#4ec9e0;}
  .turn-speaker{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:1px;color:#8fa8b8;}
  .turn-caller .turn-speaker{color:#e0bb6a;}
  .turn-agent .turn-speaker{color:#4ec9e0;}
  .turn-text{font-size:21px;line-height:1.25;color:#e4e9ec;}
  .turn-text .amt{color:#ffd166;font-weight:700;}
  .turn-note{font-size:20px;color:#ff8a5c;font-style:italic;}

  /* Right pane */
  .state-machine{background:#0e141c;border:1px solid #24303c;padding:10px 16px;}
  .sm-states{display:flex;gap:6px;}
  .sm-node{flex:1;text-align:center;padding:8px 4px;font-size:20px;font-weight:600;background:#0b0f14;border:1px solid #24303c;color:#5a7488;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;}
  .sm-node.current{background:#ff3b30;color:#fff;border-color:#ff6a5c;}
  .sm-outcomes{display:flex;gap:10px;margin-top:6px;}
  .sm-outcome{flex:1;font-size:20px;padding:5px 10px;background:#0b0f14;border:1px solid #24303c;color:#5a7488;}
  .sm-outcome.active{border-color:#ff3b30;color:#ff8a5c;font-weight:700;}
  .sm-outcome-detail::before{content:" — ";}

  /* Evidence — channel-strip rows with tally lamp */
  .evidence-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .evidence-card{background:#0e141c;border:1px solid #24303c;border-left:5px solid #ffd166;padding:6px 10px 6px 10px;position:relative;}
  .ev-head{display:flex;align-items:center;gap:8px;}
  .ev-head::before{content:"";width:12px;height:12px;border-radius:50%;background:#ffd166;box-shadow:0 0 8px 2px rgba(255,209,102,.7);flex:none;}
  .ev-label{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;color:#cfe0ea;text-transform:uppercase;}
  .ev-status{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:#ffd166;}
  .ev-status::before{content:"· ";color:#5a7488;}
  .ev-detail{font-size:20px;color:#8fa8b8;line-height:1.15;margin-top:1px;margin-left:20px;}

  /* Tool feed — rundown log */
  .tool-feed{background:#0e141c;border:1px solid #24303c;padding:6px 14px;}
  .tool-feed-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;color:#4ec9e0;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
  .tool-row{display:flex;gap:12px;font-size:20px;padding:2px 0;border-bottom:1px solid #1c2126;white-space:nowrap;}
  .tool-time{color:#ff3b30;width:60px;flex:none;}
  .tool-name{color:#e4e9ec;width:270px;flex:none;font-weight:600;}
  .tool-result{color:#8fa8b8;overflow:hidden;text-overflow:ellipsis;}

  /* Failure tally — red digital counter */
  .failure-tally{display:flex;align-items:baseline;gap:10px;background:#0e141c;border:1px solid #24303c;padding:5px 14px;}
  .failure-tally-count{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:32px;color:#ff3b30;}
  .failure-tally-label{font-size:20px;color:#8fa8b8;text-transform:uppercase;letter-spacing:1px;font-family:'Oswald',sans-serif;}

  /* Verdict banner — ON AIR sign */
  .verdict-banner{background:#1a0806;border:3px solid #ff3b30;padding:10px 18px;box-shadow:0 0 34px 6px rgba(255,59,48,.5);}
  .verdict-headline-full{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;color:#ff8a5c;letter-spacing:1px;line-height:1.16;text-transform:uppercase;}
  .verdict-subline{font-size:20px;color:#e0a08c;margin-top:4px;}

  .ftr{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0e1116;border-top:2px solid #1c2126;}
  .footer-rule{font-size:20px;color:#dfe4e8;}
  .footer-hash{font-size:20px;color:#4ec9e0;}
</style>
<div id="surround">
  <div id="stage">
    <div class="hdr">
      <div class="hdr-product"></div>
      <div class="hdr-meta"></div>
    </div>
    <div class="split">
      <section class="left-pane">
        <div class="audio-levels">
          <div class="level-meter level-caller">
            <div class="level-label"></div>
            <div class="level-ladder"></div>
            <div class="level-state"></div>
          </div>
          <div class="level-meter level-countersign">
            <div class="level-label"></div>
            <div class="level-ladder"></div>
            <div class="level-state"></div>
          </div>
        </div>
        <div class="agent-states"></div>
        <div class="transcript"></div>
      </section>
      <section class="right-pane">
        <div class="state-machine">
          <div class="sm-states"></div>
          <div class="sm-outcomes"></div>
        </div>
        <div class="evidence-cards"></div>
        <div class="tool-feed">
          <div class="tool-feed-title">Rundown — tool calls</div>
          <div class="tool-feed-rows"></div>
        </div>
        <div class="failure-tally">
          <span class="failure-tally-count"></span>
          <span class="failure-tally-label"></span>
        </div>
        <div class="verdict-banner">
          <div class="verdict-headline-full"></div>
          <div class="verdict-subline"></div>
        </div>
      </section>
    </div>
    <div class="ftr">
      <div class="footer-rule"></div>
      <div class="footer-hash"></div>
    </div>
  </div>
</div>

<script>
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent =
    `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.querySelector('.transcript');
  DATA.transcript.forEach(turn => {
    const row = el('div', `turn turn-${turn.role}`);
    row.appendChild(el('div','turn-speaker', turn.speaker));
    row.appendChild(el('div','turn-text', emphasize(turn.text)));
    if(turn.note) row.appendChild(el('div','turn-note', turn.note));
    transcriptEl.appendChild(row);
  });

  const statesEl = document.querySelector('.agent-states');
  DATA.agentStates.forEach(s => {
    statesEl.appendChild(el('div', `state-pill${s.active ? ' active' : ''}`, s.name));
  });

  function buildLadder(container, level){
    const segs = 16;
    const lit = Math.round(level*segs);
    for(let i=0;i<segs;i++){
      const s = el('div', 'seg' + (i<lit ? ' lit':''));
      container.appendChild(s);
    }
  }
  function fillLevelHead(sel, label, level){
    const head = document.querySelector(sel + ' .level-label');
    head.appendChild(document.createTextNode(label));
    const peak = el('span','level-peak', 'PEAK ' + Math.round(level*100) + '%');
    head.appendChild(peak);
  }
  fillLevelHead('.level-caller', DATA.audioLevels.caller.label, DATA.audioLevels.caller.level);
  buildLadder(document.querySelector('.level-caller .level-ladder'), DATA.audioLevels.caller.level);
  document.querySelector('.level-caller .level-state').textContent = DATA.audioLevels.caller.state;
  fillLevelHead('.level-countersign', DATA.audioLevels.countersign.label, DATA.audioLevels.countersign.level);
  buildLadder(document.querySelector('.level-countersign .level-ladder'), DATA.audioLevels.countersign.level);
  document.querySelector('.level-countersign .level-state').textContent = DATA.audioLevels.countersign.state;

  const smEl = document.querySelector('.sm-states');
  DATA.stateMachine.states.forEach(s => {
    smEl.appendChild(el('div', `sm-node${s===DATA.stateMachine.current?' current':''}`, s));
  });
  const smOutcomesEl = document.querySelector('.sm-outcomes');
  DATA.stateMachine.outcomes.forEach(o => {
    smOutcomesEl.appendChild(el('div', `sm-outcome${o.active?' active':''}`, `${o.name}<span class="sm-outcome-detail">${o.detail}</span>`));
  });

  const toolEl = document.querySelector('.tool-feed-rows');
  DATA.toolCalls.forEach(t => {
    const row = el('div','tool-row');
    row.appendChild(el('span','tool-time', t.time));
    row.appendChild(el('span','tool-name', t.name));
    row.appendChild(el('span','tool-result', t.result));
    toolEl.appendChild(row);
  });

  const evEl = document.querySelector('.evidence-cards');
  DATA.evidence.forEach(e => {
    const card = el('div', `evidence-card status-${slug(e.status)}`);
    card.setAttribute('data-status', e.status);
    const head = el('div','ev-head');
    head.appendChild(el('span','ev-label', e.label));
    head.appendChild(el('span','ev-status', e.status));
    card.appendChild(head);
    card.appendChild(el('div','ev-detail', e.detail));
    evEl.appendChild(card);
  });

  document.querySelector('.failure-tally-count').textContent = DATA.failureTally.count;
  document.querySelector('.failure-tally-label').textContent = DATA.failureTally.label;

  document.querySelector('.verdict-headline-full').textContent =
    DATA.verdictBanner.headline + ' — ' + DATA.verdictBanner.reasons.join(' · ');
  document.querySelector('.verdict-subline').textContent = DATA.verdictBanner.subline;

  document.querySelector('.footer-rule').textContent = DATA.footer.rule;
  document.querySelector('.footer-hash').textContent = 'Sealed record ' + DATA.footer.hash;

  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
