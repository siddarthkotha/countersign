<meta charset="UTF-8">
<title>Countersign · Swiss departure board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500;600;700&family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:#12151c;color:#e8ebef;font-family:'Fira Sans Condensed',Arial,sans-serif;overflow:hidden;
    border:2px solid #262b36;
  }
  .hdr{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:3px solid #ffc72c;}
  .hdr-left{display:flex;align-items:center;gap:16px;}
  .clock{width:40px;height:40px;border-radius:50%;border:3px solid #e8ebef;position:relative;flex:none;}
  .clock i{position:absolute;background:#e8ebef;left:50%;top:50%;transform-origin:0 0;}
  .clock .hh{width:2px;height:11px;margin-left:-1px;margin-top:-11px;transform:rotate(100deg);}
  .clock .mm{width:2px;height:15px;margin-left:-1px;margin-top:-15px;transform:rotate(40deg);}
  .clock .ss{width:1px;height:16px;margin-left:-0.5px;margin-top:-16px;background:#ffc72c;transform:rotate(190deg);}
  .hdr-product{font-weight:700;font-size:28px;letter-spacing:1px;color:#e8ebef;text-transform:uppercase;}
  .hdr-meta{font-family:'Fira Mono',monospace;font-size:20px;color:#9aa3b2;}

  .split{display:flex;height:calc(1080px - 66px - 56px);}
  .left-pane,.right-pane{width:960px;padding:14px 26px;display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  .left-pane{border-right:1px solid #262b36;}
  .col-title{display:flex;font-size:20px;color:#ffc72c;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #ffc72c;padding-bottom:4px;font-weight:600;}
  .col-title span:first-child{width:70px;flex:none;}

  .agent-states{display:flex;gap:0;border-bottom:1px solid #262b36;}
  .state-pill{flex:1;text-align:center;padding:6px 4px;font-size:19px;color:#5c6472;border-right:1px solid #262b36;}
  .state-pill:last-child{border-right:none;}
  .state-pill.active{color:#ffc72c;font-weight:700;}

  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
  }
  .turn{display:flex;gap:14px;padding:5px 0;border-bottom:1px solid #1c2029;}
  .turn-time{width:70px;flex:none;font-family:'Fira Mono',monospace;font-size:19px;color:#9aa3b2;}
  .turn-body{flex:1;}
  .turn-speaker{font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#9aa3b2;}
  .turn-agent .turn-speaker{color:#ffc72c;}
  .turn-text{font-size:19px;line-height:1.2;color:#e8ebef;}
  .turn-text .amt{font-weight:700;color:#ffc72c;}
  .turn-note{font-size:19px;color:#ffc72c;font-style:italic;}

  .state-machine{border-bottom:1px solid #262b36;padding-bottom:8px;}
  .sm-states{display:flex;gap:0;border:1px solid #262b36;}
  .sm-node{flex:1;text-align:center;padding:7px 4px;font-size:19px;color:#5c6472;border-right:1px solid #262b36;text-transform:uppercase;}
  .sm-node:last-child{border-right:none;}
  .sm-node.current{color:#12151c;background:#ffc72c;font-weight:700;}
  .sm-outcomes{display:flex;gap:0;margin-top:6px;border:1px solid #262b36;}
  .sm-outcome{flex:1;font-size:19px;padding:5px 10px;color:#5c6472;border-right:1px solid #262b36;}
  .sm-outcome:last-child{border-right:none;}
  .sm-outcome.active{color:#ffc72c;font-weight:700;}
  .sm-outcome-detail{font-size:19px;color:#5c6472;}
  .sm-outcome-detail::before{content:" — ";}
  .sm-outcome.active .sm-outcome-detail{color:#c99a1f;}

  .row-list{display:flex;flex-direction:column;}
  .evidence-cards{display:flex;flex-direction:column;}
  .evidence-card{display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #1c2029;align-items:baseline;}
  .ev-mark{width:20px;flex:none;font-size:20px;color:#ffc72c;}
  .ev-label{width:230px;flex:none;font-size:20px;font-weight:600;text-transform:uppercase;color:#e8ebef;}
  .ev-status{width:150px;flex:none;font-size:20px;font-weight:700;color:#ffc72c;text-transform:uppercase;}
  .ev-detail{flex:1;font-size:19px;color:#9aa3b2;}

  .tool-feed{border-top:1px solid #262b36;padding-top:6px;}
  .tool-feed-title{font-size:20px;color:#ffc72c;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;font-weight:600;}
  .tool-row{display:flex;gap:14px;font-size:19px;padding:3px 0;border-bottom:1px solid #1c2029;white-space:nowrap;font-family:'Fira Mono',monospace;}
  .tool-time{color:#ffc72c;width:58px;flex:none;}
  .tool-name{color:#e8ebef;width:280px;flex:none;font-weight:500;font-family:'Fira Sans Condensed',sans-serif;}
  .tool-result{color:#9aa3b2;overflow:hidden;text-overflow:ellipsis;font-family:'Fira Sans Condensed',sans-serif;}

  .failure-tally{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid #262b36;}
  .failure-tally-count{font-family:'Fira Mono',monospace;font-weight:700;font-size:30px;color:#ffc72c;}
  .failure-tally-label{font-size:20px;color:#9aa3b2;text-transform:uppercase;letter-spacing:1px;}

  .verdict-banner{background:#1c1608;border-top:4px solid #ffc72c;border-bottom:4px solid #ffc72c;padding:10px 4px;}
  .verdict-headline-full{font-weight:700;font-size:34px;color:#ffc72c;letter-spacing:.5px;line-height:1.14;text-transform:uppercase;}
  .verdict-subline{font-family:'Fira Mono',monospace;font-size:19px;color:#c9ba85;margin-top:4px;}

  .ftr{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-top:1px solid #262b36;}
  .footer-rule{font-size:20px;color:#e8ebef;}
  .footer-hash{font-family:'Fira Mono',monospace;font-size:20px;color:#ffc72c;}
</style>
<div id="surround">
  <div id="stage">
    <div class="hdr">
      <div class="hdr-left">
        <div class="clock"><i class="hh"></i><i class="mm"></i><i class="ss"></i></div>
        <div class="hdr-product"></div>
      </div>
      <div class="hdr-meta"></div>
    </div>
    <div class="split">
      <section class="left-pane">
        <div class="col-title"><span>Time</span><span>Transcript</span></div>
        <div class="agent-states"></div>
        <div class="transcript"></div>
      </section>
      <section class="right-pane">
        <div class="state-machine">
          <div class="sm-states"></div>
          <div class="sm-outcomes"></div>
        </div>
        <div class="col-title"><span></span><span>Checks</span></div>
        <div class="evidence-cards"></div>
        <div class="tool-feed">
          <div class="tool-feed-title">Tool calls</div>
          <div class="tool-feed-rows"></div>
        </div>
        <div class="failure-tally">
          <span class="failure-tally-count"></span>
          <span class="failure-tally-label"></span>
        </div>
        <div class="verdict-banner">
          <div class="verdict-headline-full"></div>
          <div class="verdict-subline"></div>
        </div>
      </section>
    </div>
    <div class="ftr">
      <div class="footer-rule"></div>
      <div class="footer-hash"></div>
    </div>
  </div>
</div>

<script>
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent =
    `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.querySelector('.transcript');
  DATA.transcript.forEach((turn,i) => {
    const row = el('div', `turn turn-${turn.role}`);
    row.appendChild(el('div','turn-time', String(i+1).padStart(2,'0') + '.'));
    const body = el('div','turn-body');
    body.appendChild(el('div','turn-speaker', turn.speaker));
    body.appendChild(el('div','turn-text', emphasize(turn.text)));
    if(turn.note) body.appendChild(el('div','turn-note', turn.note));
    row.appendChild(body);
    transcriptEl.appendChild(row);
  });

  const statesEl = document.querySelector('.agent-states');
  DATA.agentStates.forEach(s => {
    statesEl.appendChild(el('div', `state-pill${s.active ? ' active' : ''}`, s.name));
  });

  const smEl = document.querySelector('.sm-states');
  DATA.stateMachine.states.forEach(s => {
    smEl.appendChild(el('div', `sm-node${s===DATA.stateMachine.current?' current':''}`, s));
  });
  const smOutcomesEl = document.querySelector('.sm-outcomes');
  DATA.stateMachine.outcomes.forEach(o => {
    smOutcomesEl.appendChild(el('div', `sm-outcome${o.active?' active':''}`, `${o.name}<span class="sm-outcome-detail">${o.detail}</span>`));
  });

  const toolEl = document.querySelector('.tool-feed-rows');
  DATA.toolCalls.forEach(t => {
    const row = el('div','tool-row');
    row.appendChild(el('span','tool-time', t.time));
    row.appendChild(el('span','tool-name', t.name));
    row.appendChild(el('span','tool-result', t.result));
    toolEl.appendChild(row);
  });

  const evEl = document.querySelector('.evidence-cards');
  DATA.evidence.forEach(e => {
    const card = el('div', `evidence-card status-${slug(e.status)}`);
    card.setAttribute('data-status', e.status);
    card.appendChild(el('div','ev-mark', '■'));
    card.appendChild(el('div','ev-label', e.label));
    card.appendChild(el('div','ev-status', e.status));
    card.appendChild(el('div','ev-detail', e.detail));
    evEl.appendChild(card);
  });

  document.querySelector('.failure-tally-count').textContent = DATA.failureTally.count;
  document.querySelector('.failure-tally-label').textContent = DATA.failureTally.label;

  document.querySelector('.verdict-headline-full').textContent =
    DATA.verdictBanner.headline + ' — ' + DATA.verdictBanner.reasons.join(' · ');
  document.querySelector('.verdict-subline').textContent = DATA.verdictBanner.subline;

  document.querySelector('.footer-rule').textContent = DATA.footer.rule;
  document.querySelector('.footer-hash').textContent = 'Sealed record ' + DATA.footer.hash;

  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
