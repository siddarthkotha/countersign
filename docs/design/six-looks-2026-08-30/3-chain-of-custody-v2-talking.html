<title>Countersign · Chain of custody · Talking profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#1c1a16;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#1c1a16;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:#efe6d2;
    background-image:radial-gradient(circle at 15% 20%, rgba(0,0,0,.03) 0, transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(0,0,0,.04) 0, transparent 50%);
    color:#2a2015;font-family:'Courier Prime',ui-monospace,monospace;overflow:hidden;
    border:1px solid #b8ac8e;
  }
  .hdr{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:3px double #7a2e1f;}
  .hdr-left{display:flex;align-items:center;gap:16px;}
  .stamp-conf{
    font-family:'Special Elite',cursive;font-size:22px;color:#8a2e1f;border:3px solid #8a2e1f;
    padding:4px 12px;transform:rotate(-3deg);letter-spacing:2px;
  }
  .hdr-product{font-family:'Special Elite',cursive;font-weight:400;font-size:28px;letter-spacing:1px;color:#2a2015;}
  .hdr-meta{font-size:20px;color:#5a4a30;}

  .scene-controls{height:34px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 30px;border-bottom:1px solid #b8ac8e;background:rgba(255,255,255,.15);}
  .ctrl-btn{font-family:'Special Elite',cursive;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#8a2e1f;background:transparent;border:2px solid #8a2e1f;padding:3px 14px;cursor:pointer;transform:rotate(-1deg);border-radius:2px;}
  .ctrl-btn:hover{background:rgba(138,46,31,.08);}
  .ctrl-btn:disabled{opacity:.45;cursor:default;}
  .sound-btn{transform:rotate(1deg);}
  .sound-btn[aria-pressed="false"]{color:#8a7a5a;border-color:#8a7a5a;}

  .split{display:flex;height:calc(1080px - 74px - 60px - 34px);}
  .left-pane,.right-pane{width:960px;padding:16px 28px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
  .left-pane{border-right:2px solid #b8ac8e;}
  .panel-title{font-family:'Special Elite',cursive;font-size:20px;color:#7a2e1f;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #b8ac8e;padding-bottom:4px;}

  /* Profile block */
  .profile-block{display:flex;align-items:stretch;gap:8px;border:1px solid #b8ac8e;background:rgba(255,255,255,.22);padding:8px 14px;height:148px;flex:none;}
  .pf-caller,.pf-countersign{width:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .pf-svg{width:96px;height:112px;}
  .pf-caption{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#5a4a30;font-family:'Courier Prime',monospace;text-align:center;}
  .pf-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .pf-state-word{font-family:'Special Elite',cursive;font-size:21px;color:#7a2e1f;letter-spacing:1px;text-align:center;}
  .pf-pause{font-size:14px;color:#8a2e1f;font-style:italic;opacity:0;transition:opacity .2s;}
  .pf-pause.show{opacity:1;}
  .pf-cs-outline{fill:none;stroke:#8a2e1f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-cs-line{fill:none;stroke:#8a2e1f;stroke-width:1.5;stroke-linecap:round;opacity:.7;}
  .pf-cs-lips{fill:none;stroke:#8a2e1f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .pf-cl-outline{fill:none;stroke:#8a7a5a;stroke-width:2;stroke-linecap:round;}

  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
  }
  .turn{display:flex;gap:12px;padding:4px 0;border-bottom:1px dotted #b8ac8e;}
  .turn-line{width:26px;flex:none;color:#8a7a5a;font-size:20px;text-align:right;}
  .turn-body{flex:1;}
  .turn-speaker{font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.5px;color:#5a4a30;}
  .turn-text{font-size:20px;line-height:1.22;color:#2a2015;}
  .turn-text .amt{color:#8a2e1f;font-weight:700;}
  .turn-note{font-size:20px;color:#8a2e1f;font-style:italic;}
  .turn-note::before{content:"[ "}
  .turn-note::after{content:" ]"}

  .evidence-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .evidence-card{border:1px solid #b8ac8e;padding:6px 10px;position:relative;background:rgba(255,255,255,.25);}
  .ev-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
  .ev-label{font-size:20px;font-weight:700;text-transform:uppercase;color:#2a2015;}
  .ev-status{font-family:'Special Elite',cursive;font-size:19px;color:#8a2e1f;border:2px solid #8a2e1f;padding:1px 8px;transform:rotate(-2deg);white-space:nowrap;text-shadow:0 0 1px rgba(138,46,31,.4);}
  .ev-detail{font-size:20px;color:#5a4a30;line-height:1.15;margin-top:2px;}

  .tool-feed{border:1px solid #b8ac8e;padding:6px 14px;background:rgba(255,255,255,.15);}
  .tool-feed-title{font-family:'Special Elite',cursive;font-size:19px;color:#7a2e1f;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
  .tool-row{display:flex;gap:12px;font-size:20px;padding:2px 0;border-bottom:1px dotted #b8ac8e;white-space:nowrap;}
  .tool-time{color:#8a7a5a;width:56px;flex:none;}
  .tool-name{color:#2a2015;width:270px;flex:none;font-weight:700;}
  .tool-result{color:#5a4a30;overflow:hidden;text-overflow:ellipsis;}

  .failure-tally{display:flex;align-items:baseline;gap:10px;border:1px solid #b8ac8e;padding:5px 14px;background:rgba(255,255,255,.2);}
  .failure-tally-count{font-family:'Special Elite',cursive;font-weight:400;font-size:30px;color:#8a2e1f;}
  .failure-tally-label{font-size:20px;color:#5a4a30;text-transform:uppercase;letter-spacing:1px;}

  .verdict-banner{position:relative;padding:8px 18px 8px 156px;border:3px double #8a2e1f;background:rgba(138,46,31,.06);min-height:96px;opacity:0;}
  .verdict-banner.landed{opacity:1;animation:stampland .15s ease-out;}
  @keyframes stampland{from{transform:scale(1.28);opacity:0;}to{transform:scale(1);opacity:1;}}
  .verdict-stamp{position:absolute;left:16px;top:50%;margin-top:-30px;font-family:'Special Elite',cursive;font-size:20px;color:#8a2e1f;border:4px solid #8a2e1f;padding:6px 6px;transform:rotate(-8deg);text-align:center;line-height:1.1;width:88px;text-shadow:0 0 1px rgba(138,46,31,.5);}
  .verdict-headline-full{font-family:'Special Elite',cursive;font-size:27px;color:#6e1f14;letter-spacing:.5px;line-height:1.22;}
  .verdict-subline{font-size:20px;color:#5a4a30;margin-top:4px;}

  .ftr{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-top:3px double #7a2e1f;}
  .footer-rule{font-size:20px;color:#2a2015;}
  .footer-hash{font-size:20px;color:#8a2e1f;font-weight:700;transition:color .3s, text-shadow .3s;}
  .footer-hash.sealed{color:#6e1f14;text-shadow:0 0 2px rgba(138,46,31,.4);}
</style>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  const WOBBLE = true; // look-3 hand-drawn wobble
  const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent = `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.getElementById('transcript');
  const evidenceEl = document.getElementById('evidenceCards');
  const toolRowsEl = document.getElementById('toolRows');
  const tallyCountEl = document.getElementById('tallyCount');
  const tallyLabelEl = document.getElementById('tallyLabel');
  const verdictBannerEl = document.getElementById('verdictBanner');
  const verdictHeadlineEl = document.getElementById('verdictHeadline');
  const verdictSublineEl = document.getElementById('verdictSubline');
  const footerRuleEl = document.getElementById('footerRule');
  const footerHashEl = document.getElementById('footerHash');
  const stateWordEl = document.getElementById('stateWord');
  const pauseEl = document.getElementById('pauseMarker');
  const playBtn = document.getElementById('playBtn');
  const soundBtn = document.getElementById('soundBtn');
  const csSvgEl = document.getElementById('csSvg');
  const clSvgEl = document.getElementById('clSvg');

  footerRuleEl.textContent = DATA.footer.rule;

  /* ---------- seeded RNG + syllable/envelope engine ---------- */
  function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function countSyllables(word){ const w=word.toLowerCase().replace(/[^a-z]/g,''); if(!w) return 1; let syl=(w.match(/[aeiouy]+/g)||[]).length; if(w.length>2 && w.endsWith('e') && !w.endsWith('le')) syl-=1; return Math.max(1,syl); }
  function buildSchedule(text, duration, seed){
    const words = text.split(/\s+/).filter(Boolean);
    const rnd = mulberry32(seed);
    const sylCounts = words.map(countSyllables);
    const totalSyl = sylCounts.reduce((a,b)=>a+b,0) || 1;
    let t=0; const wordEvents=[]; const sylEvents=[];
    words.forEach((w,i)=>{
      const wStart=t; const wTime=(sylCounts[i]/totalSyl)*duration; const sDur=wTime/sylCounts[i];
      for(let s=0;s<sylCounts[i];s++){ const amp=Math.min(1,(0.55+rnd()*0.45)*(s===0?1.15:1.0)); sylEvents.push({start:t,end:t+sDur,amp}); t+=sDur; }
      wordEvents.push({word:w, start:wStart, end:t});
    });
    return { wordEvents, sylEvents, totalDuration:t };
  }
  function envelopeAt(sylEvents, localT, totalDur){
    if(localT<0 || localT>=totalDur) return 0;
    for(const e of sylEvents){ if(localT>=e.start && localT<e.end){ const p=(localT-e.start)/(e.end-e.start); return e.amp*Math.sin(Math.max(0,Math.min(1,p))*Math.PI); } }
    return 0;
  }
  function wordsVisibleAt(wordEvents, localT){ const out=[]; for(const we of wordEvents){ if(we.start<=localT) out.push(we.word); else break; } return out; }

  /* ---------- profile SVG geometry ---------- */
  const CS_OUTLINE=[[150,18],[112,20],[88,42],[72,60],[60,76],[30,106],[46,116],[50,124],[50,136],[58,152],[76,168],[104,182],[138,180],[150,205],[153,298],[188,298],[193,215],[190,115],[172,38]];
  const CS_BROW=[[68,58],[84,50],[100,46]];
  const CS_CHEEK=[[66,92],[80,100],[92,112]];
  const CS_JAW=[[62,150],[78,164],[100,176],[128,176]];
  const CS_EAR=[[136,132],[148,140],[150,155],[140,165]];
  function mirrorX(pts){ return pts.map(([x,y])=>[220-x,y]); }
  function jitter(pts, seed, amt){ if(!amt) return pts; const rnd=mulberry32(seed); return pts.map(([x,y])=>[x+(rnd()-0.5)*amt*2, y+(rnd()-0.5)*amt*2]); }
  function smoothPath(pts, closed){
    if(pts.length<3) return 'M'+pts.map(p=>p.join(',')).join(' L');
    const p = closed ? [pts[pts.length-1]].concat(pts,[pts[0],pts[1]]) : [pts[0]].concat(pts,[pts[pts.length-1]]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for(let i=1;i<p.length-2;i++){
      const p0=p[i-1],p1=p[i],p2=p[i+1],p3=p[i+2];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d += ` C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0]},${p2[1]}`;
    }
    if(closed) d += ' Z';
    return d;
  }
  function mouthD(env){
    const lx=48, ly=127, rx=64, ry=133; const midX=(lx+rx)/2;
    const topCtrlY = Math.min(ly,ry) - 3 - env*1.2;
    const botCtrlY = Math.max(ly,ry) + 2 + env*11;
    return `M${lx},${ly} Q${midX},${topCtrlY.toFixed(2)} ${rx},${ry} Q${midX},${botCtrlY.toFixed(2)} ${lx},${ly} Z`;
  }
  const svgNS='http://www.w3.org/2000/svg';
  function makePath(id, cls, d, extra){ const p=document.createElementNS(svgNS,'path'); p.setAttribute('id',id); p.setAttribute('class',cls); p.setAttribute('d',d); if(extra) Object.entries(extra).forEach(([k,v])=>p.setAttribute(k,v)); return p; }

  function buildCsSvg(){
    const g=document.createElementNS(svgNS,'g'); g.setAttribute('id','csGroup');
    g.appendChild(makePath('csOutline','pf-cs-outline', smoothPath(jitter(CS_OUTLINE,11,WOBBLE?1.2:0),true)));
    g.appendChild(makePath('csBrow','pf-cs-line', smoothPath(jitter(CS_BROW,12,WOBBLE?1:0),false)));
    g.appendChild(makePath('csCheek','pf-cs-line', smoothPath(jitter(CS_CHEEK,13,WOBBLE?1:0),false)));
    g.appendChild(makePath('csJaw','pf-cs-line', smoothPath(jitter(CS_JAW,14,WOBBLE?1:0),false)));
    g.appendChild(makePath('csEar','pf-cs-line', smoothPath(jitter(CS_EAR,15,WOBBLE?1:0),false)));
    g.appendChild(makePath('csLips','pf-cs-lips', mouthD(0)));
    csSvgEl.appendChild(g);
    return { group:g, lips:document.getElementById('csLips'), jaw:document.getElementById('csJaw'), brow:document.getElementById('csBrow'), cheek:document.getElementById('csCheek'), ear:document.getElementById('csEar') };
  }
  function buildClSvg(){
    const g=document.createElementNS(svgNS,'g'); g.setAttribute('id','clGroup');
    g.appendChild(makePath('clOutline','pf-cl-outline', smoothPath(mirrorX(jitter(CS_OUTLINE,21,WOBBLE?1.2:0)),true), {'stroke-dasharray':'16 8 16 8 50 12 16 8 70 14 16 8 30 10'}));
    clSvgEl.appendChild(g);
    return { group:g };
  }
  const csRefs = buildCsSvg();
  const clRefs = buildClSvg();

  function pulseCaller(env){ clRefs.group.style.opacity=(0.62+env*0.38).toFixed(2); clRefs.group.style.transform=`scale(${(1+env*0.02).toFixed(3)})`; }
  function restCaller(){ clRefs.group.style.opacity='0.8'; clRefs.group.style.transform='scale(1)'; }
  function resetFaces(){
    csRefs.lips.setAttribute('d', mouthD(0));
    csRefs.jaw.style.transform='translate(0px,0px)';
    csRefs.brow.style.transform='translate(0,0)';
    csRefs.cheek.style.transform='translate(0,0)';
    csRefs.ear.style.transform='translate(0,0)';
    csRefs.group.style.transform='';
    restCaller();
  }

  /* ---------- speaking windows (fixed script, independent of audio) ---------- */
  const CS_WINDOWS=[
    { start:0.0, end:4.2, schedule: buildSchedule(DATA.transcript[5].text, 6.0, 205) },
    { start:7.2, end:9.6, schedule: buildSchedule(DATA.transcript[7].text, 2.4, 207) },
    { start:11.5, end:19.0, schedule: buildSchedule(DATA.transcript[8].text, 7.3, 208) }
  ];
  const CALLER_WINDOW = { start:4.2, end:6.4, schedule: buildSchedule(DATA.transcript[6].text, 2.2, 206) };
  function isFrozen(t){ return t>=4.2 && t<7.2; }
  function csWindowAt(t){ for(const w of CS_WINDOWS){ if(t>=w.start && t<w.end) return w; } return null; }
  function applyDrift(t, speaking){
    const base = speaking ? 1.4 : 0;
    const amp = REDUCED_MOTION ? base*0.3 : base;
    if(amp===0){ csRefs.brow.style.transform='translate(0,0)'; csRefs.cheek.style.transform='translate(0,0)'; csRefs.ear.style.transform='translate(0,0)'; return; }
    csRefs.brow.style.transform = `translate(${(Math.sin(t*2.1+0.4)*amp).toFixed(2)}px, ${(Math.cos(t*1.6+0.4)*amp*0.7).toFixed(2)}px)`;
    csRefs.cheek.style.transform = `translate(${(Math.sin(t*1.8+1.6)*amp).toFixed(2)}px, ${(Math.cos(t*2.3+1.6)*amp*0.7).toFixed(2)}px)`;
    csRefs.ear.style.transform = `translate(${(Math.sin(t*1.5+2.7)*amp*0.8).toFixed(2)}px, ${(Math.cos(t*1.9+2.7)*amp*0.8).toFixed(2)}px)`;
  }
  function updateFaces(t){
    if(!isFrozen(t)){
      const w = csWindowAt(t);
      if(w){
        const localT = t - w.start;
        const env = envelopeAt(w.schedule.sylEvents, localT, w.schedule.totalDuration);
        csRefs.lips.setAttribute('d', mouthD(env));
        csRefs.jaw.style.transform = `translate(0px, ${(env*4).toFixed(2)}px)`;
        applyDrift(t, true);
        csRefs.group.style.transform='';
      } else {
        csRefs.lips.setAttribute('d', mouthD(0));
        csRefs.jaw.style.transform='translate(0px,0px)';
        applyDrift(t, false);
        const amp = REDUCED_MOTION ? 0.3 : 1.0;
        const breathe = Math.sin((t/4)*2*Math.PI)*amp;
        csRefs.group.style.transform = `translate(0px, ${breathe.toFixed(2)}px)`;
      }
    }
    if(t>=CALLER_WINDOW.start && t<CALLER_WINDOW.end){
      const localT = t-CALLER_WINDOW.start;
      const env = envelopeAt(CALLER_WINDOW.schedule.sylEvents, localT, CALLER_WINDOW.schedule.totalDuration);
      pulseCaller(env);
    } else { restCaller(); }
  }

  /* ---------- transcript / evidence / tool feed / verdict rendering ---------- */
  const turnRowRefs = {};
  function createTurnRow(turnIndex, role){
    const turn = DATA.transcript[turnIndex];
    const row = el('div', `turn turn-${role}`);
    row.appendChild(el('div','turn-line', String(turnIndex+1).padStart(2,'0')));
    const body = el('div','turn-body');
    body.appendChild(el('span','turn-speaker', turn.speaker + ':  '));
    const textSpan = el('span','turn-text','');
    body.appendChild(textSpan);
    row.appendChild(body);
    transcriptEl.appendChild(row);
    const ref = { row, body, textSpan };
    turnRowRefs[turnIndex] = ref;
    return ref;
  }
  function appendNote(turnIndex, text){ const ref=turnRowRefs[turnIndex]; if(ref) ref.body.appendChild(el('div','turn-note', text)); }

  let activeReveal = null;
  function startTurnReveal(turnIndex, windowStart, schedule, role){
    const ref = createTurnRow(turnIndex, role);
    activeReveal = { turnIndex, windowStart, schedule, ref };
  }
  function updateActiveReveal(t){
    if(!activeReveal) return;
    const localT = Math.max(0, t - activeReveal.windowStart);
    const words = wordsVisibleAt(activeReveal.schedule.wordEvents, localT);
    activeReveal.ref.textSpan.innerHTML = emphasize(words.join(' '));
  }

  function addEvidenceCard(item){
    const card = el('div','evidence-card');
    const head = el('div','ev-head');
    head.appendChild(el('span','ev-label', item.label));
    head.appendChild(el('span','ev-status', item.status));
    card.appendChild(head);
    card.appendChild(el('div','ev-detail', item.detail));
    evidenceEl.appendChild(card);
  }
  function addToolRow(item){
    const row = el('div','tool-row');
    row.appendChild(el('span','tool-time', item.time));
    row.appendChild(el('span','tool-name', item.name));
    row.appendChild(el('span','tool-result', item.result));
    toolRowsEl.appendChild(row);
  }
  function setTally(n){ tallyCountEl.textContent=n; tallyLabelEl.textContent=DATA.failureTally.label; }
  function setState(word){ stateWordEl.textContent = word; }
  function showPause(show){ pauseEl.classList.toggle('show', show); }
  function landVerdict(){
    verdictHeadlineEl.textContent = DATA.verdictBanner.headline + ' — ' + DATA.verdictBanner.reasons.join(' · ');
    verdictSublineEl.textContent = DATA.verdictBanner.subline;
    verdictBannerEl.classList.add('landed');
  }
  function sealFooter(){ footerHashEl.textContent = 'Sealed record ' + DATA.footer.hash; footerHashEl.classList.add('sealed'); }

  /* ---------- fixed 20s script timeline ---------- */
  const EVENTS = [
    { t:0.0, fn:()=>{ startTurnReveal(5, 0.0, CS_WINDOWS[0].schedule, 'agent'); setState('SPEAKING'); } },
    { t:4.2, fn:()=>{ appendNote(5, 'interrupted at 03:12'); startTurnReveal(6, 4.2, CALLER_WINDOW.schedule, 'caller'); setState('LISTENING'); } },
    { t:6.4, fn:()=>{ showPause(true); } },
    { t:7.2, fn:()=>{ showPause(false); startTurnReveal(7, 7.2, CS_WINDOWS[1].schedule, 'agent'); setState('SPEAKING'); } },
    { t:9.6, fn:()=>{ setState('VERIFYING'); setTally(3); } },
    { t:9.9, fn:()=>{ setState('AWAITING OUT-OF-BAND'); addToolRow(DATA.toolCalls[2]); } },
    { t:10.2, fn:()=>{ addEvidenceCard(DATA.evidence[3]); addEvidenceCard(DATA.evidence[4]); setTally(4); } },
    { t:11.5, fn:()=>{ setState('VERDICT'); startTurnReveal(8, 11.5, CS_WINDOWS[2].schedule, 'agent'); } },
    { t:16.0, fn:()=>{ addToolRow(DATA.toolCalls[3]); addToolRow(DATA.toolCalls[4]); } },
    { t:17.0, fn:()=>{ addToolRow(DATA.toolCalls[5]); } },
    { t:19.0, fn:()=>{ landVerdict(); sealFooter(); } }
  ];
  const END_AT = 20.5;
  let appliedCount = 0;
  function applyEvents(t){ while(appliedCount<EVENTS.length && EVENTS[appliedCount].t<=t){ EVENTS[appliedCount].fn(); appliedCount++; } }

  /* ---------- speech synthesis (decorative only; timeline never depends on it) ---------- */
  let soundOn = true;
  let voicesCache = [];
  function refreshVoices(){
    if(!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices() || [];
    const enUS = voices.filter(v => /en-US/i.test(v.lang));
    const distinct = [];
    for(const v of enUS){ if(!distinct.some(d=>d.name===v.name)) distinct.push(v); if(distinct.length>=2) break; }
    voicesCache = distinct;
  }
  if(window.speechSynthesis){ refreshVoices(); window.speechSynthesis.onvoiceschanged = refreshVoices; }
  function speakLine(text, voiceIdx){
    if(!soundOn || !window.speechSynthesis) return;
    refreshVoices();
    if(voicesCache.length===0) return; // silent, no voices found
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voicesCache[voiceIdx % voicesCache.length];
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  }
  let scheduledTimeouts = [];
  function clearScheduled(){ scheduledTimeouts.forEach(id=>clearTimeout(id)); scheduledTimeouts=[]; }
  function scheduleSpeech(){
    scheduledTimeouts.push(setTimeout(()=>speakLine(DATA.transcript[5].text,0), 0));
    scheduledTimeouts.push(setTimeout(()=>{ if(window.speechSynthesis) window.speechSynthesis.cancel(); speakLine(DATA.transcript[6].text,1); }, 4200));
    scheduledTimeouts.push(setTimeout(()=>speakLine(DATA.transcript[7].text,0), 7200));
    scheduledTimeouts.push(setTimeout(()=>speakLine(DATA.transcript[8].text,0), 11500));
  }

  /* ---------- run loop / controls ---------- */
  let playStartTime=null, rafId=null, running=false;
  function resetScene(){
    running=false;
    if(rafId) cancelAnimationFrame(rafId);
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    clearScheduled();
    appliedCount=0; activeReveal=null;
    for(const k in turnRowRefs) delete turnRowRefs[k];
    transcriptEl.innerHTML='';
    for(let i=0;i<4;i++){
      const turn = DATA.transcript[i];
      const ref = createTurnRow(i, turn.role);
      ref.textSpan.innerHTML = emphasize(turn.text);
      if(turn.note) ref.body.appendChild(el('div','turn-note', turn.note));
    }
    setState('VERIFYING');
    showPause(false);
    evidenceEl.innerHTML='';
    addEvidenceCard(DATA.evidence[0]); addEvidenceCard(DATA.evidence[1]); addEvidenceCard(DATA.evidence[2]);
    toolRowsEl.innerHTML='';
    addToolRow(DATA.toolCalls[0]); addToolRow(DATA.toolCalls[1]);
    setTally(2);
    verdictBannerEl.classList.remove('landed');
    verdictHeadlineEl.textContent=''; verdictSublineEl.textContent='';
    footerHashEl.textContent = 'Sealed record —';
    footerHashEl.classList.remove('sealed');
    resetFaces();
    playBtn.textContent = '▶ PLAY SCENE';
    playBtn.dataset.state = 'play';
    playBtn.disabled = false;
  }
  function frame(now){
    if(!running) return;
    const t = (now-playStartTime)/1000;
    const tc = Math.min(t, END_AT);
    applyEvents(tc);
    updateActiveReveal(t);
    updateFaces(t);
    if(t>=END_AT){ endScene(); return; }
    rafId = requestAnimationFrame(frame);
  }
  function endScene(){
    running=false;
    playBtn.disabled=false;
    playBtn.textContent = '↻ REPLAY';
    playBtn.dataset.state='replay';
  }
  function startScene(){
    resetScene();
    running=true;
    playBtn.disabled=true;
    playBtn.textContent = '▶ PLAYING…';
    const soundSnapshot = soundOn;
    playStartTime = performance.now();
    if(soundSnapshot) scheduleSpeech();
    rafId = requestAnimationFrame(frame);
  }
  playBtn.addEventListener('click', startScene);
  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
    if(!soundOn && window.speechSynthesis) window.speechSynthesis.cancel();
  });

  resetScene();

  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
})();
</script>
