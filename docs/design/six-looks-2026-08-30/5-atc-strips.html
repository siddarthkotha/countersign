<meta charset="UTF-8">
<title>Countersign · Air-traffic strips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#1a1917;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#1a1917;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:#34322c;color:#2a2418;font-family:'Space Mono',ui-monospace,monospace;overflow:hidden;
    border:2px solid #46433a;
  }
  .hdr{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#26241f;border-bottom:2px solid #46433a;}
  .hdr-product{font-weight:700;font-size:26px;letter-spacing:2px;color:#ecdfc0;text-transform:uppercase;}
  .hdr-meta{font-size:20px;color:#a8a08c;}

  .split{display:flex;height:calc(1080px - 66px - 56px);}
  .left-pane,.right-pane{width:960px;padding:14px 24px;display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  .left-pane{border-right:2px solid #46433a;}
  .bay-title{font-size:20px;color:#c9c2a8;text-transform:uppercase;letter-spacing:2px;}

  .agent-states{display:flex;gap:6px;}
  .state-pill{flex:1;text-align:center;padding:5px 4px;font-size:19px;background:#26241f;color:#8a8470;border:1px solid #46433a;}
  .state-pill.active{background:#ecdfc0;color:#22314a;font-weight:700;border-color:#ecdfc0;}

  /* Strips */
  .strip{
    background:#ecdfc0;border:1px solid #c9bd94;border-radius:1px;padding:5px 12px 5px 20px;position:relative;
    box-shadow:1px 1px 0 rgba(0,0,0,.25);
  }
  .strip::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;background:#8a8470;}
  .strip-caller{border-left:5px solid #b08a2a;}
  .strip-agent{border-left:5px solid #22314a;}
  .strip-speaker{font-size:19px;font-weight:700;color:#4a4530;text-transform:uppercase;}
  .strip-text{font-size:19px;line-height:1.18;color:#241f10;}
  .strip-text .amt{font-family:'Caveat',cursive;font-weight:700;font-size:1.3em;color:#22314a;}
  .strip-note{
    font-family:'Caveat',cursive;font-weight:700;font-size:24px;color:#22314a;
    transform:rotate(-2deg);display:inline-block;
  }
  .strip-note::before{content:"↗ "}

  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
  }

  .state-machine{background:#26241f;border:1px solid #46433a;padding:8px 14px;}
  .sm-states{display:flex;gap:6px;}
  .sm-node{flex:1;text-align:center;padding:6px 4px;font-size:19px;background:#1e1c18;border:1px solid #46433a;color:#8a8470;}
  .sm-node.current{background:#ecdfc0;color:#22314a;border-color:#ecdfc0;font-weight:700;}
  .sm-outcomes{display:flex;gap:10px;margin-top:6px;}
  .sm-outcome{flex:1;font-size:19px;padding:5px 10px;background:#1e1c18;border:1px solid #46433a;color:#8a8470;}
  .sm-outcome.active{border-color:#ecdfc0;color:#ecdfc0;font-weight:700;}
  .sm-outcome-detail{font-family:'Caveat',cursive;font-size:22px;}
  .sm-outcome-detail::before{content:" — ";font-family:'Space Mono',monospace;}

  .bay-checks, .bay-verdict{display:flex;flex-direction:column;gap:5px;}
  .evidence-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .evidence-card{background:#ecdfc0;border:1px solid #c9bd94;border-left:5px solid #b08a2a;padding:5px 10px 5px 18px;position:relative;}
  .evidence-card::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:3px;background:#8a8470;}
  .ev-head{display:flex;align-items:baseline;gap:8px;}
  .ev-label{font-size:19px;font-weight:700;color:#4a4530;text-transform:uppercase;}
  .ev-status{font-family:'Caveat',cursive;font-weight:700;font-size:23px;color:#22314a;transform:rotate(-2deg);display:inline-block;}
  .ev-detail{font-size:19px;color:#5a5340;line-height:1.14;margin-top:1px;}

  .tool-feed{background:#26241f;border:1px solid #46433a;padding:5px 14px;}
  .tool-feed-title{font-size:19px;color:#c9c2a8;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
  .tool-row{display:flex;gap:12px;font-size:19px;padding:2px 0;border-bottom:1px solid #38352d;color:#d8d0b8;white-space:nowrap;}
  .tool-time{color:#ecdfc0;width:58px;flex:none;}
  .tool-name{color:#ecdfc0;width:270px;flex:none;font-weight:700;}
  .tool-result{color:#a8a08c;overflow:hidden;text-overflow:ellipsis;}

  .failure-tally{display:flex;align-items:baseline;gap:10px;background:#26241f;border:1px solid #46433a;padding:5px 14px;}
  .failure-tally-count{font-family:'Caveat',cursive;font-weight:700;font-size:34px;color:#ecdfc0;}
  .failure-tally-label{font-size:19px;color:#a8a08c;text-transform:uppercase;letter-spacing:1px;}

  .verdict-banner{
    background:#ecdfc0;border:1px solid #c9bd94;padding:10px 18px 10px 26px;position:relative;
    transform:rotate(-1deg);box-shadow:2px 3px 6px rgba(0,0,0,.35);
  }
  .verdict-arrow{position:absolute;left:-18px;top:50%;transform:translateY(-50%) rotate(-6deg);font-family:'Caveat',cursive;font-weight:700;font-size:30px;color:#ecdfc0;}
  .verdict-headline-full{font-family:'Caveat',cursive;font-weight:700;font-size:32px;color:#22314a;letter-spacing:.5px;line-height:1.1;}
  .verdict-subline{font-size:19px;color:#4a4530;margin-top:4px;}

  .ftr{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#26241f;border-top:2px solid #46433a;}
  .footer-rule{font-size:20px;color:#ecdfc0;}
  .footer-hash{font-size:20px;color:#c9c2a8;}
</style>
<div id="surround">
  <div id="stage">
    <div class="hdr">
      <div class="hdr-product"></div>
      <div class="hdr-meta"></div>
    </div>
    <div class="split">
      <section class="left-pane">
        <div class="bay-title">Bay 1 — active call (latest strip at bottom)</div>
        <div class="agent-states"></div>
        <div class="transcript"></div>
      </section>
      <section class="right-pane">
        <div class="state-machine">
          <div class="sm-states"></div>
          <div class="sm-outcomes"></div>
        </div>
        <div class="bay-title">Bay 2 — checks</div>
        <div class="evidence-cards"></div>
        <div class="tool-feed">
          <div class="tool-feed-title">Tool calls</div>
          <div class="tool-feed-rows"></div>
        </div>
        <div class="failure-tally">
          <span class="failure-tally-count"></span>
          <span class="failure-tally-label"></span>
        </div>
        <div class="bay-title">Bay 3 — verdict (pulled up, turned)</div>
        <div class="verdict-banner">
          <div class="verdict-arrow">↑</div>
          <div class="verdict-headline-full"></div>
          <div class="verdict-subline"></div>
        </div>
      </section>
    </div>
    <div class="ftr">
      <div class="footer-rule"></div>
      <div class="footer-hash"></div>
    </div>
  </div>
</div>

<script>
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent =
    `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.querySelector('.transcript');
  DATA.transcript.forEach(turn => {
    const row = el('div', `strip strip-${turn.role}`);
    row.appendChild(el('span','strip-speaker', turn.speaker + '  '));
    row.appendChild(el('span','strip-text', emphasize(turn.text)));
    if(turn.note) row.appendChild(el('div','strip-note', turn.note));
    transcriptEl.appendChild(row);
  });

  const statesEl = document.querySelector('.agent-states');
  DATA.agentStates.forEach(s => {
    statesEl.appendChild(el('div', `state-pill${s.active ? ' active' : ''}`, s.name));
  });

  const smEl = document.querySelector('.sm-states');
  DATA.stateMachine.states.forEach(s => {
    smEl.appendChild(el('div', `sm-node${s===DATA.stateMachine.current?' current':''}`, s));
  });
  const smOutcomesEl = document.querySelector('.sm-outcomes');
  DATA.stateMachine.outcomes.forEach(o => {
    smOutcomesEl.appendChild(el('div', `sm-outcome${o.active?' active':''}`, `${o.name}<span class="sm-outcome-detail">${o.detail}</span>`));
  });

  const toolEl = document.querySelector('.tool-feed-rows');
  DATA.toolCalls.forEach(t => {
    const row = el('div','tool-row');
    row.appendChild(el('span','tool-time', t.time));
    row.appendChild(el('span','tool-name', t.name));
    row.appendChild(el('span','tool-result', t.result));
    toolEl.appendChild(row);
  });

  const evEl = document.querySelector('.evidence-cards');
  DATA.evidence.forEach(e => {
    const card = el('div', `evidence-card status-${slug(e.status)}`);
    card.setAttribute('data-status', e.status);
    const head = el('div','ev-head');
    head.appendChild(el('span','ev-label', e.label));
    head.appendChild(el('span','ev-status', e.status));
    card.appendChild(head);
    card.appendChild(el('div','ev-detail', e.detail));
    evEl.appendChild(card);
  });

  document.querySelector('.failure-tally-count').textContent = DATA.failureTally.count;
  document.querySelector('.failure-tally-label').textContent = DATA.failureTally.label;

  document.querySelector('.verdict-headline-full').textContent =
    DATA.verdictBanner.headline + ' — ' + DATA.verdictBanner.reasons.join(' · ');
  document.querySelector('.verdict-subline').textContent = DATA.verdictBanner.subline;

  document.querySelector('.footer-rule').textContent = DATA.footer.rule;
  document.querySelector('.footer-hash').textContent = 'Sealed record ' + DATA.footer.hash;

  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
