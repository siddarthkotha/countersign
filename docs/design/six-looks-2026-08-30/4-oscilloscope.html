<meta charset="UTF-8">
<title>Countersign · Oscilloscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  #surround{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;
    background:#0a0d0b;color:#bcd8c8;font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;
    border:10px solid #1c211d;box-shadow:inset 0 0 60px rgba(0,0,0,.6);
  }
  .hdr{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:2px solid #294038;}
  .hdr-product{font-weight:700;font-size:26px;letter-spacing:3px;color:#39ff8a;text-transform:uppercase;text-shadow:0 0 8px rgba(57,255,138,.6);}
  .hdr-meta{font-size:20px;color:#6fa088;}

  .split{display:flex;height:calc(1080px - 70px - 58px);}
  .left-pane,.right-pane{width:960px;padding:14px 26px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
  .left-pane{border-right:2px solid #294038;}

  /* Trace graticule */
  .trace-box{
    border:1px solid #294038;background:
      repeating-linear-gradient(0deg, transparent 0 39px, #1a2620 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, #1a2620 39px 40px),
      #0d130f;
    height:170px;position:relative;
  }
  .trace-box svg{display:block;width:100%;height:100%;}
  .trace-label{position:absolute;top:4px;left:8px;font-size:20px;color:#ffb020;text-shadow:0 0 4px rgba(255,176,32,.6);}
  .trace-label.ch2{color:#39ff8a;top:auto;bottom:4px;text-shadow:0 0 4px rgba(57,255,138,.6);}
  .trace-note{position:absolute;font-size:20px;color:#ffb020;top:4px;right:8px;}

  .agent-states{display:flex;gap:6px;}
  .state-pill{flex:1;text-align:center;padding:6px 4px;font-size:20px;border:1px solid #294038;color:#4a6858;letter-spacing:.5px;}
  .state-pill.active{background:#0e2a1a;color:#39ff8a;border-color:#39ff8a;text-shadow:0 0 6px rgba(57,255,138,.7);font-weight:700;}

  .transcript{
    flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
    mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 6px, black 46px);
  }
  .turn{padding:4px 10px;border-left:3px solid #294038;}
  .turn-caller{border-left-color:#ffb020;}
  .turn-agent{border-left-color:#39ff8a;}
  .turn-speaker{font-size:20px;text-transform:uppercase;letter-spacing:1px;color:#6fa088;}
  .turn-caller .turn-speaker{color:#ffb020;}
  .turn-agent .turn-speaker{color:#39ff8a;}
  .turn-text{font-size:20px;line-height:1.22;color:#cfe8da;}
  .turn-text .amt{color:#39ff8a;font-weight:700;text-shadow:0 0 4px rgba(57,255,138,.5);}
  .turn-note{font-size:20px;color:#ffb020;font-style:italic;}

  .state-machine{border:1px solid #294038;padding:8px 14px;}
  .sm-states{display:flex;gap:6px;}
  .sm-node{flex:1;text-align:center;padding:7px 4px;font-size:20px;border:1px solid #294038;color:#4a6858;}
  .sm-node.current{background:#0e2a1a;color:#39ff8a;border-color:#39ff8a;text-shadow:0 0 6px rgba(57,255,138,.7);font-weight:700;}
  .sm-outcomes{display:flex;gap:10px;margin-top:6px;}
  .sm-outcome{flex:1;font-size:20px;padding:5px 10px;border:1px solid #294038;color:#4a6858;}
  .sm-outcome.active{border-color:#39ff8a;color:#39ff8a;font-weight:700;}
  .sm-outcome-detail::before{content:" — ";}

  .evidence-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .evidence-card{border:1px solid #294038;padding:6px 10px;background:#0d130f;}
  .ev-head{display:flex;align-items:center;gap:8px;}
  .ev-label{font-size:20px;color:#8fbfa8;text-transform:uppercase;}
  .ev-status{font-size:20px;color:#39ff8a;font-weight:700;text-shadow:0 0 4px rgba(57,255,138,.5);}
  .ev-status::before{content:"= ";color:#4a6858;}
  .ev-detail{font-size:20px;color:#5e8873;line-height:1.15;margin-top:1px;}

  .tool-feed{border:1px solid #294038;padding:6px 14px;background:#0d130f;}
  .tool-feed-title{font-size:20px;color:#8fbfa8;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
  .tool-row{display:flex;gap:12px;font-size:20px;padding:2px 0;border-bottom:1px solid #17201a;white-space:nowrap;}
  .tool-time{color:#39ff8a;width:60px;flex:none;}
  .tool-name{color:#cfe8da;width:270px;flex:none;font-weight:600;}
  .tool-result{color:#5e8873;overflow:hidden;text-overflow:ellipsis;}

  .failure-tally{display:flex;align-items:baseline;gap:10px;border:1px solid #294038;padding:5px 14px;background:#0d130f;}
  .failure-tally-count{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:32px;color:#ffb020;text-shadow:0 0 6px rgba(255,176,32,.5);}
  .failure-tally-label{font-size:20px;color:#6fa088;text-transform:uppercase;letter-spacing:1px;}

  .verdict-banner{border:2px solid #39ff8a;padding:10px 18px;background:#0a1a10;box-shadow:0 0 30px 2px rgba(57,255,138,.35), inset 0 0 20px rgba(57,255,138,.08);}
  .verdict-headline-full{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:32px;color:#39ff8a;letter-spacing:1px;line-height:1.15;text-transform:uppercase;text-shadow:0 0 10px rgba(57,255,138,.7);}
  .verdict-subline{font-size:20px;color:#8fbfa8;margin-top:4px;}

  .ftr{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-top:2px solid #294038;}
  .footer-rule{font-size:20px;color:#bcd8c8;}
  .footer-hash{font-size:20px;color:#39ff8a;}
</style>
<div id="surround">
  <div id="stage">
    <div class="hdr">
      <div class="hdr-product"></div>
      <div class="hdr-meta"></div>
    </div>
    <div class="split">
      <section class="left-pane">
        <div class="trace-box">
          <div class="trace-label">CH1 CALLER</div>
          <div class="trace-note">interrupted at 03:12</div>
          <div class="trace-label ch2">CH2 COUNTERSIGN</div>
          <svg viewBox="0 0 960 170" preserveAspectRatio="none"></svg>
        </div>
        <div class="agent-states"></div>
        <div class="transcript"></div>
      </section>
      <section class="right-pane">
        <div class="state-machine">
          <div class="sm-states"></div>
          <div class="sm-outcomes"></div>
        </div>
        <div class="evidence-cards"></div>
        <div class="tool-feed">
          <div class="tool-feed-title">Tool calls</div>
          <div class="tool-feed-rows"></div>
        </div>
        <div class="failure-tally">
          <span class="failure-tally-count"></span>
          <span class="failure-tally-label"></span>
        </div>
        <div class="verdict-banner">
          <div class="verdict-headline-full"></div>
          <div class="verdict-subline"></div>
        </div>
      </section>
    </div>
    <div class="ftr">
      <div class="footer-rule"></div>
      <div class="footer-hash"></div>
    </div>
  </div>
</div>

  "transcript": [

<script>
  const DATA = JSON.parse(document.getElementById('content-data').textContent);
  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function emphasize(text){
    return text.replace(/\$[\d.,]+ ?(million)?/g, m => `<span class="amt">${m}</span>`)
                .replace(/one point eight/gi, m => `<span class="amt">${m}</span>`);
  }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

  document.querySelector('.hdr-product').textContent = DATA.header.product;
  document.querySelector('.hdr-meta').textContent =
    `${DATA.header.session} · ${DATA.header.desk} · ${DATA.header.callTime} · state ${DATA.header.state}`;

  const transcriptEl = document.querySelector('.transcript');
  DATA.transcript.forEach(turn => {
    const row = el('div', `turn turn-${turn.role}`);
    row.appendChild(el('span','turn-speaker', turn.speaker + '  '));
    row.appendChild(el('span','turn-text', emphasize(turn.text)));
    if(turn.note) row.appendChild(el('div','turn-note', turn.note));
    transcriptEl.appendChild(row);
  });

  const statesEl = document.querySelector('.agent-states');
  DATA.agentStates.forEach(s => {
    statesEl.appendChild(el('div', `state-pill${s.active ? ' active' : ''}`, s.name));
  });

  const smEl = document.querySelector('.sm-states');
  DATA.stateMachine.states.forEach(s => {
    smEl.appendChild(el('div', `sm-node${s===DATA.stateMachine.current?' current':''}`, s));
  });
  const smOutcomesEl = document.querySelector('.sm-outcomes');
  DATA.stateMachine.outcomes.forEach(o => {
    smOutcomesEl.appendChild(el('div', `sm-outcome${o.active?' active':''}`, `${o.name}<span class="sm-outcome-detail">${o.detail}</span>`));
  });

  const toolEl = document.querySelector('.tool-feed-rows');
  DATA.toolCalls.forEach(t => {
    const row = el('div','tool-row');
    row.appendChild(el('span','tool-time', t.time));
    row.appendChild(el('span','tool-name', t.name));
    row.appendChild(el('span','tool-result', t.result));
    toolEl.appendChild(row);
  });

  const evEl = document.querySelector('.evidence-cards');
  DATA.evidence.forEach(e => {
    const card = el('div', `evidence-card status-${slug(e.status)}`);
    card.setAttribute('data-status', e.status);
    const head = el('div','ev-head');
    head.appendChild(el('span','ev-label', e.label));
    head.appendChild(el('span','ev-status', e.status));
    card.appendChild(head);
    card.appendChild(el('div','ev-detail', e.detail));
    evEl.appendChild(card);
  });

  document.querySelector('.failure-tally-count').textContent = DATA.failureTally.count;
  document.querySelector('.failure-tally-label').textContent = DATA.failureTally.label;

  document.querySelector('.verdict-headline-full').textContent =
    DATA.verdictBanner.headline + ' — ' + DATA.verdictBanner.reasons.join(' · ');
  document.querySelector('.verdict-subline').textContent = DATA.verdictBanner.subline;

  document.querySelector('.footer-rule').textContent = DATA.footer.rule;
  document.querySelector('.footer-hash').textContent = 'Sealed record ' + DATA.footer.hash;

  /* Build the two traces */
  (function(){
    const svg = document.querySelector('.trace-box svg');
    const W = 960, H = 170, MID1 = 55, MID2 = 120;
    function wave(mid, amp, points, freq){
      let d = `M0 ${mid}`;
      for(let x=0;x<=points;x++){
        const px = (x/points)*W;
        const py = mid - Math.sin(x*freq)*amp*(0.6+0.4*Math.sin(x*0.11));
        d += ` L${px.toFixed(1)} ${py.toFixed(1)}`;
      }
      return d;
    }
    /* caller: wave then spike then flat (barge-in cut) */
    const cutAt = 620;
    let callerD = `M0 ${MID1}`;
    for(let x=0;x<=cutAt;x+=6){
      const py = MID1 - Math.sin(x*0.09)*10*(0.6+0.4*Math.sin(x*0.03));
      callerD += ` L${x} ${py.toFixed(1)}`;
    }
    callerD += ` L${cutAt+8} ${MID1-46} L${cutAt+16} ${MID1+40} L${cutAt+24} ${MID1}`;
    for(let x=cutAt+30;x<=W;x+=20){ callerD += ` L${x} ${MID1}`; }

    const countersignD = wave(MID2, 26, 160, 0.28);

    const ns = 'http://www.w3.org/2000/svg';
    function path(d, color, width){
      const p = document.createElementNS(ns,'path');
      p.setAttribute('d', d);
      p.setAttribute('stroke', color);
      p.setAttribute('stroke-width', width);
      p.setAttribute('fill','none');
      p.setAttribute('stroke-linecap','round');
      p.setAttribute('stroke-linejoin','round');
      return p;
    }
    svg.appendChild(path(callerD, '#ffb020', 3));
    svg.appendChild(path(countersignD, '#39ff8a', 4));
    /* barge-in marker line */
    const marker = document.createElementNS(ns,'line');
    marker.setAttribute('x1', cutAt); marker.setAttribute('x2', cutAt);
    marker.setAttribute('y1', 0); marker.setAttribute('y2', H);
    marker.setAttribute('stroke', '#ffb020'); marker.setAttribute('stroke-width', 1);
    marker.setAttribute('stroke-dasharray', '4 4');
    marker.setAttribute('opacity', '0.6');
    svg.appendChild(marker);
  })();

  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
